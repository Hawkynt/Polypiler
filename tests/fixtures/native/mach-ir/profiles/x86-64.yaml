# RAX with its parts in 64-bit mode, as the Intel 64 and IA-32 Architectures Software Developer's
# Manual vol. 1 §3.4.1.1 states them: a 32-bit write zero-extends to RAX, an 8- or 16-bit write
# leaves the other 56 or 48 bits alone. Every part names RAX as its parent so that the policy of each
# applies to the whole root. A fixture for the sub-register rules, not the x64 profile.
isa: x86-64
addressBits: 64
byteOrder: little
registers:
  - {name: rax, bits: 64}
  - {name: eax, bits: 32, parent: rax, offset: 0, write: zero-extend}
  - {name: ax, bits: 16, parent: rax, offset: 0, write: preserve}
  - {name: al, bits: 8, parent: rax, offset: 0, write: preserve}
  - {name: ah, bits: 8, parent: rax, offset: 8, write: preserve}
flags:
  - {name: cf}
