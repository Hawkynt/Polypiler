# The general registers of IA-32 with their 16- and 8-bit parts, as the Intel 64 and IA-32
# Architectures Software Developer's Manual vol. 1 §3.4.1 lays them out: a write to AX, AL or AH
# leaves the other bits of EAX alone. A fixture for the sub-register rules, not the x86 profile.
isa: x86-32
addressBits: 32
byteOrder: little
registers:
  - {name: eax, bits: 32}
  - {name: ebx, bits: 32}
  - {name: ax, bits: 16, parent: eax, offset: 0, write: preserve}
  - {name: al, bits: 8, parent: ax, offset: 0, write: preserve}
  - {name: ah, bits: 8, parent: ax, offset: 8, write: preserve}
  - {name: bx, bits: 16, parent: ebx, offset: 0, write: preserve}
flags:
  - {name: cf}
  - {name: zf}
