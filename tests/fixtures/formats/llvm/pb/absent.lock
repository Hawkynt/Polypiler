# The two toolchains of the characterization, as on a machine that has neither: their probes name
# executables that do not exist. PbEmitterCharacterizationTests checks what a test that requires them
# reports there.
schema: 1
toolchains:
  llvm:
    version: "23.1.3"
    probe: [no-such-llvm-config-polypiler, --version]
    versionPattern: '^(?<version>\d+\.\d+\.\d+)'
    platforms: [linux, windows, macos]
    licence: Apache-2.0 WITH LLVM-exception
    source: https://github.com/llvm/llvm-project/releases
  pb-compiler:
    version: "0d73acbea185a2597357d53f7ce9acb44758ba76"
    probe: [no-such-pbc-polypiler, --version]
    versionPattern: '(?<version>[0-9a-f]{40})'
    platforms: [linux, windows, macos]
    licence: LGPL-3.0-or-later
    source: https://github.com/Hawkynt/PB-Compiler
