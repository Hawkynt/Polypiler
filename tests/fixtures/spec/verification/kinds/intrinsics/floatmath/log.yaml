  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {F: TYPES.f64}, inputs: ["0x3FF0000000000000"], outputs: ["0x0000000000000000"]}
    - {types: {F: TYPES.f64}, inputs: ["0x0000000000000000"], outputs: ["0xFFF0000000000000"]}
    - {types: {F: TYPES.f64}, inputs: ["0x7FF0000000000000"], outputs: ["0x7FF0000000000000"]}
