id: INTRINSICS.Log
title: Natural logarithm
version: 1
status: draft
owner: Hawkynt
issue: INT-FLOATREF
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: Log
  group: FloatMath
  typeParameters: [{name: F, constraint: float}]
  parameters: [{name: x, type: F}]
  returns: [{name: logarithm, type: F}]
  legality: []
  effects: [pure]
  exactness: {mode: tolerance, policy: VERIFICATION.tolerance.log}
  reference:
    algorithm: "the natural logarithm of x; -infinity for a zero, a NaN below -0"
