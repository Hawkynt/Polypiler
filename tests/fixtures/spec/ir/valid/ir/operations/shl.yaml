id: IR.shl
title: Shift left
version: 1
status: draft
owner: Hawkynt
issue: IR-INT
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: >-
  Shl shifts the bits of an integer value left by an amount and discards the bits shifted out of the
  width of T; the vacated low bits are zero. Shl[mask] MUST take the amount modulo the width of T.
  Shl[strict] MUST trap with invalid-shift when the amount is at least the width of T. The prototype's
  structured IR (Polypiler.Core.IR) implements the mask variant only, as IrBinaryOp.ShiftLeft with an
  i32 amount; the strict variant and an amount of type T belong to the typed SSA IR of IR-INT.
spec:
  kind: operation
  mnemonic: Shl
  category: shift
  typeParameters: [{name: T, constraint: integer}]
  operands: [{name: value, type: T}, {name: amount, type: T}]
  result: {type: T}
  flags: [mask, strict]
  effects: [pure]
  traps: [{when: "flag strict and amount >= width", kind: invalid-shift}]
  stages: {from: IR.stage.source-semantic, to: IR.stage.legalized-target}
  examples:
    - {flag: mask, operands: ["0x80000001", 33], result: "0x00000002"}
    - {flag: strict, operands: ["0x00000001", 31], result: "0x80000000"}
    - {flag: strict, operands: ["0x00000001", 32], trap: invalid-shift}
