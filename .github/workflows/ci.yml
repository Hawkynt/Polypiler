name: CI

# The gate a pull request has to pass. Rename Polypiler.slnx below to this repo's solution.
#
# It does NOT run on a push to main. A pull request must be green to merge, so re-running the same
# matrix on the merge commit proves nothing and costs a machine — the nightly builds main after the
# merge instead. `workflow_call` stays, because release.yml runs this as its own first gate.
#
# Almost everything lives in the shared reusable workflow; a repo with something exotic keeps that
# one job here and lets the shared one do the rest.
on:
  pull_request:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  # The `if:` guard keeps this from running in RepositoryTemplate itself, which has no solution to
  # build. It is harmless in generated repos: their name never equals the template's.
  ci:
    if: ${{ github.repository != 'Hawkynt/RepositoryTemplate' }}
    uses: Hawkynt/RepositoryTemplate/.github/workflows/dotnet-ci.yml@v1
    with:
      solution: Polypiler.slnx
      dotnet-version: '10.0.x'
      # The tests run in the layer jobs below, on the runners of their layer files (layer-core: ubuntu
      # and windows); this job keeps the build, the package and repository README checks and the
      # coverage report of the shared workflow. Its test step is pointed at a project without tests,
      # so that the suite does not run a second time.
      os-matrix: '["ubuntu-latest"]'
      test-target: Polypiler.Core/Polypiler.Core.csproj
      repo-readme: true
      # Only Polypiler.Tests references the coverage collector; the acceptance tests add nothing to the
      # report, so the coverage leg does not run them a second time on Linux.
      coverage-target: Polypiler.Tests/Polypiler.Tests.csproj

  # The documents generated from the specifications must match them: the error catalogue docs/errors
  # is what spec/diagnostics.yaml and the notes of docs/errors/notes give (PLY0091 otherwise).
  generated-docs:
    name: generated documents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: report errors --check
        run: dotnet run --project Polypiler.Tooling/Polypiler.Tooling.csproj -c Release -- report errors --check

  # Polypiler gates coverage, which the shared workflow only reports: at least 95 % of all lines AND
  # of all conditional branches must be executed by the tests (ISSUES.md, "Test strategy").
  coverage-gate:
    name: coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      MIN_LINE: '95'
      MIN_BRANCH: '95'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The unit tests carry the coverage (AGENTS.md); the acceptance tests run in the test matrix.
      - name: Test with coverage
        run: dotnet test Polypiler.Tests/Polypiler.Tests.csproj -c Debug --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Enforce line and branch thresholds
        shell: python
        run: |
          import glob, os, sys, xml.etree.ElementTree as ET
          totals = {"lines": [0, 0], "branches": [0, 0]}
          reports = glob.glob("coverage/**/coverage.cobertura.xml", recursive=True)
          if not reports:
            sys.exit("no coverage report produced")
          for report in reports:
            root = ET.parse(report).getroot()
            for kind in totals:
              totals[kind][0] += int(root.get(f"{kind}-covered"))
              totals[kind][1] += int(root.get(f"{kind}-valid"))
          failed = False
          for kind, minimum in (("lines", float(os.environ["MIN_LINE"])), ("branches", float(os.environ["MIN_BRANCH"]))):
            covered, valid = totals[kind]
            rate = 100.0 if valid == 0 else 100.0 * covered / valid
            print(f"{kind}: {covered}/{valid} = {rate:.2f} % (minimum {minimum:.0f} %)")
            if rate < minimum:
              print(f"::error::{kind} coverage {rate:.2f} % is below {minimum:.0f} %")
              failed = True
          sys.exit(1 if failed else 0)

  # The core layer of PRD §7.3 (tooling/ci/layers/core.yaml): warnings as errors, format, every test
  # that belongs to no other layer, the IR verifier, spec validation and the audit that holds layer
  # files, this workflow, the test categories and the tests to each other (tooling/ci/categories.yaml).
  # The toolchains come at the versions tooling/toolchains.lock pins, as `ci env` prints them; format,
  # spec validation and the audit read nothing that differs per runner and run on Linux only.
  layer-core:
    name: layer-core ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      POLYPILER_REQUIRE_TOOLCHAINS: '1'
      DOTNET_NOLOGO: 'true'
      TOOLING: dotnet run --project Polypiler.Tooling/Polypiler.Tooling.csproj -c Release --no-build --
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # global.json holds every later dotnet to the SDK the lock pins, whichever others the runner has.
      - name: ci env
        id: env
        run: |
          dotnet build Polypiler.Tooling/Polypiler.Tooling.csproj -c Release -warnaserror
          $TOOLING ci env --layer core > "$RUNNER_TEMP/toolchains.env"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/toolchains.env"
          sdk=$(sed -n 's/^dotnet-sdk=//p' "$RUNNER_TEMP/toolchains.env")
          printf '{ "sdk": { "version": "%s", "rollForward": "disable" } }\n' "$sdk" > global.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.env.outputs.node }}
      - name: toolchains
        run: |
          $TOOLING toolchains validate
          $TOOLING toolchains probe --only dotnet-sdk,node
      - name: build
        run: dotnet build Polypiler.slnx -c Release -warnaserror
      - name: format
        if: runner.os == 'Linux'
        # The fixtures are inputs whose exact text the tests read; tests/fixtures/infra/ci/core holds
        # an unformatted file on purpose.
        run: dotnet format Polypiler.slnx --verify-no-changes --no-restore --exclude tests/fixtures
      - name: test
        run: dotnet test Polypiler.slnx -c Release --no-build --filter "TestCategory!~Layer.|TestCategory=Layer.core"
      - name: ir-verifier
        run: dotnet test Polypiler.slnx -c Release --no-build --filter "TestCategory=IrVerifier"
      - name: spec validate
        if: runner.os == 'Linux'
        run: $TOOLING spec validate
      - name: ci audit
        if: runner.os == 'Linux'
        run: $TOOLING ci audit

  # Golden files (PRD 11.2): every one matches tests/fixtures/golden.lock.json and names an independent
  # source, and on a pull request no commit changes one together with code or without its line in
  # tests/fixtures/golden.changes.md.
  golden-integrity:
    name: golden integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check golden files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            dotnet run --project Polypiler.Tooling -c Release -- integrity check --base "origin/$BASE_REF"
          else
            dotnet run --project Polypiler.Tooling -c Release -- integrity check
          fi

  # tests/fixtures/bitperm is exported from the pinned BitPerm page (tooling/bitperm/export.mjs). This
  # re-runs the exporter on the corpus copy of the page and fails on any file that differs, is missing
  # or is no longer produced; the wall time of the export is printed for the record, not gated.
  bitperm-drift:
    name: bitperm fixture drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      PAGE: corpus/upstream/Hawkynt/Hawkynt.github.io@b3a8a8e92cbca83475986391c3cac56f0b185d29/BitPerm/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Import the pinned page
        run: dotnet run --project Polypiler.Tooling/Polypiler.Tooling.csproj -c Release -- corpus import --fixture bitperm.page
      - name: Check the fixtures against the page
        run: |
          start=$(date +%s%N)
          node tooling/bitperm/export.mjs --page "$PAGE" --out tests/fixtures/bitperm --check --expect-blocks 16 --expect-presets 25 --expect-tests 51
          echo "export wall time: $(( ($(date +%s%N) - start) / 1000000 )) ms"

  # The native layer of PRD §7.3 (tooling/ci/layers/native.yaml): C and C++ compiled by the pinned gcc
  # and clang and executed under the sanitizers tooling/ci/layers/native.sanitizers.yaml names; a
  # heap overflow and a signed overflow must be caught wherever there are sanitizers. No hosted
  # runner image carries gcc 16.2.1, so the Linux leg runs in the Arch Linux image of 2026-10-25 with
  # pacman on the archive snapshot of that day, which holds gcc 16.2.1, clang 23.1.3 and bubblewrap
  # 0.13.1. The container is privileged so that bubblewrap can unshare its namespaces: the runner is
  # isolated there, and the sanitizers' leak check can stop the program's threads. macOS and Windows
  # take clang from the LLVM release of the pinned version, Windows with its lld-link (NativeFlags).
  layer-native:
    name: layer-native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: { image: 'archlinux:base-20261025.0.616225', options: --privileged }
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      POLYPILER_REQUIRE_TOOLCHAINS: '1'
      DOTNET_NOLOGO: 'true'
      TOOLING: dotnet run --project Polypiler.Tooling/Polypiler.Tooling.csproj -c Release --no-build --
      ARCHIVE: https://archive.archlinux.org/repos/2026/10/25
    defaults:
      run:
        shell: bash
    steps:
      - name: archive snapshot
        if: runner.os == 'Linux'
        run: |
          echo "Server = $ARCHIVE/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm
          pacman -S --noconfirm --needed git icu gcc clang compiler-rt bubblewrap
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: ci env
        id: env
        run: |
          dotnet build Polypiler.Tooling/Polypiler.Tooling.csproj -c Release -warnaserror
          $TOOLING ci env --layer native > "$RUNNER_TEMP/toolchains.env"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/toolchains.env"
          sdk=$(sed -n 's/^dotnet-sdk=//p' "$RUNNER_TEMP/toolchains.env")
          printf '{ "sdk": { "version": "%s", "rollForward": "disable" } }\n' "$sdk" > global.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: clang
        if: runner.os != 'Linux'
        env:
          VERSION: ${{ steps.env.outputs.clang }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            name="LLVM-$VERSION-macOS-ARM64"
            members=("$name/bin/clang" "$name/bin/clang-${VERSION%%.*}" "$name/lib/clang")
          else
            name="clang+llvm-$VERSION-x86_64-pc-windows-msvc"
            members=("$name/bin/clang.exe" "$name/bin/lld-link.exe" "$name/lib/clang")
          fi
          temp=$(cd "$RUNNER_TEMP" && pwd)
          command -v zstd || brew install zstd
          curl -fsSL --retry 3 -o "$temp/llvm.tar.zst" "https://github.com/llvm/llvm-project/releases/download/llvmorg-$VERSION/$name.tar.zst"
          mkdir -p "$temp/llvm"
          zstd -dc --long=31 "$temp/llvm.tar.zst" | (cd "$temp/llvm" && tar -xf - --strip-components 1 "${members[@]}")
          rm "$temp/llvm.tar.zst"
          if [ "$RUNNER_OS" = macOS ]; then
            echo "$temp/llvm/bin" >> "$GITHUB_PATH"
            echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          else
            cygpath -w "$temp/llvm/bin" >> "$GITHUB_PATH"
          fi
      - name: toolchains
        run: |
          mkdir -p artifacts/layer-native
          $TOOLING toolchains probe --only dotnet-sdk,gcc,clang,bubblewrap | tee artifacts/layer-native/probe.txt
      - name: build
        run: dotnet build Polypiler.Tests.Acceptance/Polypiler.Tests.Acceptance.csproj -c Release -warnaserror
      - name: test
        run: >-
          dotnet test Polypiler.Tests.Acceptance/Polypiler.Tests.Acceptance.csproj -c Release --no-build
          --filter "TestCategory=Layer.native"
          --logger "trx;LogFileName=native.trx" --logger "console;verbosity=normal"
          --results-directory artifacts/layer-native
      - name: summary
        if: always()
        run: |
          case "$RUNNER_OS" in Linux) platform=linux ;; macOS) platform=macos ;; *) platform=windows ;; esac
          {
            echo "### layer-native $platform"
            for compiler in gcc clang; do
              groups=$(sed -n "s|^  $platform/$compiler: ||p" tooling/ci/layers/native.sanitizers.yaml)
              if [ -z "$groups" ]; then
                echo "- $platform/$compiler: not used on this platform"
              elif [ "$groups" = none ]; then
                echo "- $platform/$compiler: sanitizers: unavailable; the positive fixtures ran without them, the sanitizer negatives were not run"
              else
                echo "- $platform/$compiler: sanitizers: $groups"
              fi
            done
            echo
            echo '```'
            cat artifacts/layer-native/probe.txt 2>/dev/null || echo "no probe output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer-native-${{ matrix.os }}
          path: artifacts/layer-native
          if-no-files-found: warn
