# The one place an exact toolchain version is pinned (ISSUES.md, "Toolchains"). Format:
# spec/schemas/toolchains.schema.json. Check it with `polypiler-tooling toolchains validate`; compare
# a machine against it with `polypiler-tooling toolchains probe`.
#
# The 26 keys of backlog/README.md are the core: `validate` fails when one is missing, and `probe`
# without `--only` reports exactly those. Every other key is optional and added by the issue that
# first needs it. Keys stay in ordinal order.
#
# Where each version comes from, as of 2026-11-14:
#   dotnet-sdk  the SDK `actions/setup-dotnet` installs for `10.0.x` on the CI runners (CI run
#               43581325761: 10.0.404 on ubuntu-26.04 and windows-2025-vs2026). The development
#               host builds with 10.0.112; docs/adr measurements name that one.
#   node        the node of the ubuntu-26.04 runner image 20261111.196, which runs the acceptance
#               tests (24.22.2). The windows-2025-vs2026 image 20261103.298 carries 22.23.4 and the
#               development host 22.23.3; until the CI layer installs node from this file, those
#               two probe as Mismatch.
#   gcc, mpfr, gmp
#               the versions tests/vectors/float/generate/versions.txt records for the reference
#               vectors (gcc 16.2.1, MPFR 4.2.2, GMP 6.3.0). gcc is used on Linux only: the `gcc`
#               of a macOS runner is Apple's clang and the one of a Windows runner MinGW's, so the
#               native layer (tooling/ci/layers/native.yaml) builds with clang there. The layer's
#               Linux job takes gcc, clang and bubblewrap at these versions from the Arch Linux
#               archive snapshot of 2026-10-25, the only hosted source of gcc 16.2.1.
#   git         the release line of the development host's git (2.56.0), which imported the corpus
#               lock (polypiler-tooling corpus import). Pinned to major and minor: the hosted
#               runners' git takes every patch release with the image (2.56.1 on ubuntu-latest in
#               2026-11), and a patch release changes nothing the corpus import and the BASIC
#               layer read with it.
#   NuGet       acornima, roslyn and the ref-* reference assemblies are the versions the project
#               files restore (Polypiler.Core.Frontends.*/*.csproj,
#               Polypiler.Tests/Prototype/Support/ReferenceAssemblies.props); a test holds both in step.
#   aflplusplus the coverage-guided engine of polypiler-tooling fuzz run --engine afl; only the
#               nightly fuzz run needs it. afl-fuzz prints its version in the banner of -h.
#   bubblewrap  the sandbox of the cross-language runner on Linux (tooling/ci/runner.yaml); the
#               version installed on the development host. Where it is missing or the kernel forbids
#               it to unshare namespaces, the runner is Limited and refuses untrusted plans.
#   vice, vice-x128, vice-xvic, petcat
#               the Commodore emulators and BASIC lister of the development host's VICE 3.10, which
#               run the Commodore BASIC oracles (Polypiler.Core.Verification/Emulators).
#   xvfb-run    the virtual X server the VICE emulators run under on Linux: the X.Org version
#               xdpyinfo reports for the server xvfb-run starts (xorg-server-xvfb on the
#               development host).
#   pcbasic     the GW-BASIC oracle (Polypiler.Core.Verification.Emulators.PcBasic): the PyPI release
#               installed with pip into a virtual environment, whose folder PCBASIC_HOME names. Used
#               only as an external process; none of its GPL code enters the repository.
#   pb-compiler, dosbox-x, llvm, vice, pcbasic
#               the BASIC/PB layer (tooling/ci/basic/install.sh, CI run of layer-basic on ubuntu-26.04).
#               pb-compiler is built from the pinned commit; pbc prints no version of its own, so the
#               installed command is a wrapper that answers --version with that commit. dosbox-x is
#               the ubuntu-26.04 package (2026.01.02): upstream ships no Linux binaries, and the
#               Flathub build (2026.10.01) cannot start inside the runner's bubblewrap sandbox. vice
#               and its sibling emulators and petcat are built there from the VICE 3.10 release
#               source, which carries the ROM images, llvm is three tools of the LLVM release
#               archive, pcbasic the PyPI release in a virtual environment.
#   rust        the stable release the Rust layer (tooling/ci/layers/rust.yaml) installs with rustup,
#               components rustfmt and clippy. The probe asks cargo, which the layer runs and whose
#               version a stable release shares with rustc; the development host has 1.99.0 too.
#   rust-miri   the dated nightly the Rust layer runs Miri with, never a build: the first nightly of
#               2026-11 whose manifest lists miri for x86_64-unknown-linux-gnu. rustup installs it with
#               the components miri and rust-src; RUST_MIRI_HOME names its sysroot, whose folder name
#               under rustup's toolchains carries the channel. The probe runs miri, so a nightly
#               without the miri component is not installed (PLY0021).
#   others      no test runs them yet. Installed on the development host: read from the tool
#               (clang, llvm, jdk, perl, python, ruby, go). Not installed: the latest
#               stable upstream release (aflplusplus, fbc, fpc, ilspy-cli, ilverify,
#               kotlinc, nasm, php, qemu-user, typescript, wabt, wasmtime, z3).
schema: 1
toolchains:
  acornima:
    version: "1.9.1"
    kind: nuget
    requires: dotnet-sdk
    probe: [Acornima]
    versionPattern: '^(?<version>.+)$'
    platforms: [linux, windows, macos]
    licence: BSD-3-Clause
    source: https://www.nuget.org/packages/Acornima
  aflplusplus:
    version: "5.03c"
    probe: [afl-fuzz, -h]
    versionPattern: 'afl-fuzz\+\+(?<version>\d+\.\d+[a-z])'
    platforms: [linux, macos]
    licence: Apache-2.0
    source: https://github.com/AFLplusplus/AFLplusplus/releases
  bubblewrap:
    version: "0.13.1"
    probe: [bwrap, --version]
    versionPattern: '^bubblewrap (?<version>\d+\.\d+\.\d+)$'
    platforms: [linux]
    licence: LGPL-2.0-or-later
    source: https://github.com/containers/bubblewrap/releases
  clang:
    version: "23.1.3"
    probe: [clang, --version]
    versionPattern: 'clang version (?<version>\d+\.\d+\.\d+)'
    platforms: [linux, windows, macos]
    licence: Apache-2.0 WITH LLVM-exception
    source: https://github.com/llvm/llvm-project/releases
  dosbox-x:
    version: "2026.01.02"
    probe: [dosbox-x, --version]
    versionPattern: 'version (?<version>\d{4}\.\d{2}\.\d{2})'
    platforms: [linux, windows, macos]
    licence: GPL-2.0-or-later
    source: https://github.com/joncampbell123/dosbox-x/releases
    oracleOnly: true
  dotnet-sdk:
    version: "10.0.404"
    probe: [dotnet, --version]
    versionPattern: '^(?<version>\d+\.\d+\.\d+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://dotnet.microsoft.com/download/dotnet/10.0
    home: DOTNET_ROOT
  fbc:
    version: "1.10.1"
    probe: [fbc, --version]
    versionPattern: 'Version (?<version>\d+\.\d+\.\d+)'
    platforms: [linux, windows]
    licence: GPL-2.0-or-later
    source: https://github.com/freebasic/fbc/releases
  fpc:
    version: "3.2.2"
    probe: [fpc, -iV]
    versionPattern: '^(?<version>\d+\.\d+\.\d+)$'
    platforms: [linux, windows, macos]
    licence: GPL-2.0-or-later
    source: https://www.freepascal.org/download.html
  gcc:
    version: "16.2.1"
    probe: [gcc, -dumpfullversion]
    versionPattern: '^(?<version>\d+\.\d+\.\d+)$'
    platforms: [linux]
    licence: GPL-3.0-or-later WITH GCC-exception-3.1
    source: https://gcc.gnu.org/releases.html
  git:
    version: "2.56"
    probe: [git, --version]
    versionPattern: '^git version (?<version>\d+\.\d+)'
    platforms: [linux, windows, macos]
    licence: GPL-2.0-only
    source: https://git-scm.com/downloads
  gmp:
    version: "6.3.0"
    kind: package
    requires: gcc
    probe: [pkg-config, --modversion, gmp]
    versionPattern: '^(?<version>\d+\.\d+\.\d+)$'
    platforms: [linux]
    licence: LGPL-3.0-or-later OR GPL-2.0-or-later
    source: https://gmplib.org/
    oracleOnly: true
  go:
    version: "1.27.2"
    probe: [go, version]
    versionPattern: '^go version go(?<version>\d+\.\d+(\.\d+)?)'
    platforms: [linux, windows, macos]
    licence: BSD-3-Clause
    source: https://go.dev/dl/
  ilspy-cli:
    version: "11.2.0.10050"
    probe: [ilspycmd, --version]
    versionPattern: '^ilspycmd: (?<version>\S+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://www.nuget.org/packages/ilspycmd
    oracleOnly: true
  ilverify:
    version: "10.0.15"
    probe: [ilverify, --version]
    versionPattern: '^(?<version>\d+\.\d+\.\d+)'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://www.nuget.org/packages/dotnet-ilverify
    oracleOnly: true
  jdk:
    version: "27"
    probe: [javac, -version]
    versionPattern: '^javac (?<version>\S+)$'
    platforms: [linux, windows, macos]
    licence: GPL-2.0-only WITH Classpath-exception-2.0
    source: https://jdk.java.net/
    home: JAVA_HOME
  kotlinc:
    version: "2.4.21"
    probe: [kotlinc, -version]
    versionPattern: 'kotlinc-jvm (?<version>\d+\.\d+\.\d+)'
    platforms: [linux, windows, macos]
    licence: Apache-2.0
    source: https://github.com/JetBrains/kotlin/releases
    roots: [JAVA_HOME]
  llvm:
    version: "23.1.3"
    probe: [llvm-config, --version]
    versionPattern: '^(?<version>\d+\.\d+\.\d+)'
    platforms: [linux, windows, macos]
    licence: Apache-2.0 WITH LLVM-exception
    source: https://github.com/llvm/llvm-project/releases
  mpfr:
    version: "4.2.2"
    kind: package
    requires: gcc
    probe: [pkg-config, --modversion, mpfr]
    versionPattern: '^(?<version>\d+\.\d+\.\d+)$'
    platforms: [linux]
    licence: LGPL-3.0-or-later
    source: https://www.mpfr.org/
    oracleOnly: true
  nasm:
    version: "3.02"
    probe: [nasm, -v]
    versionPattern: '^NASM version (?<version>\S+)'
    platforms: [linux, windows, macos]
    licence: BSD-2-Clause
    source: https://www.nasm.us/pub/nasm/releasebuilds/
  node:
    version: "24.22.2"
    probe: [node, --version]
    versionPattern: '^v(?<version>\d+\.\d+\.\d+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://nodejs.org/dist/
  pb-compiler:
    version: "0d73acbea185a2597357d53f7ce9acb44758ba76"
    probe: [pbc, --version]
    versionPattern: '(?<version>[0-9a-f]{40})'
    platforms: [linux, windows, macos]
    licence: LGPL-3.0-or-later
    source: https://github.com/Hawkynt/PB-Compiler
  pcbasic:
    version: "2.0.8"
    probe: [pcbasic, --version]
    versionPattern: '^PC-BASIC (?<version>\d+\.\d+\.\d+)$'
    platforms: [linux, windows, macos]
    licence: GPL-3.0-or-later
    source: https://pypi.org/project/pcbasic/
    home: PCBASIC_HOME
    oracleOnly: true
  perl:
    version: "5.42.3"
    probe: [perl, -e, 'print $^V']
    versionPattern: '^v(?<version>\d+\.\d+\.\d+)$'
    platforms: [linux, windows, macos]
    licence: Artistic-1.0-Perl OR GPL-1.0-or-later
    source: https://www.perl.org/get.html
  petcat:
    version: "3.10"
    probe: [petcat, -version]
    versionPattern: '\(VICE (?<version>\d+\.\d+(\.\d+)?)\)'
    platforms: [linux, windows, macos]
    licence: GPL-2.0-or-later
    source: https://vice-emu.sourceforge.io/
    oracleOnly: true
  php:
    version: "8.5.12"
    probe: [php, --version]
    versionPattern: '^PHP (?<version>\d+\.\d+\.\d+)'
    platforms: [linux, windows, macos]
    licence: PHP-3.01
    source: https://www.php.net/downloads.php
  python:
    version: "3.14.8"
    probe: [python3, --version]
    versionPattern: '^Python (?<version>\d+\.\d+\.\d+)$'
    platforms: [linux, windows, macos]
    licence: PSF-2.0
    source: https://www.python.org/downloads/
  qemu-user:
    version: "11.1.3"
    probe: [qemu-x86_64, --version]
    versionPattern: 'version (?<version>\d+\.\d+\.\d+)'
    platforms: [linux]
    licence: GPL-2.0-only
    source: https://download.qemu.org/
  ref-net10-0:
    version: "10.0.0"
    kind: nuget
    requires: dotnet-sdk
    probe: [Microsoft.NETCore.App.Ref]
    versionPattern: '^(?<version>.+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://www.nuget.org/packages/Microsoft.NETCore.App.Ref
  ref-net2-0:
    version: "1.0.3"
    kind: nuget
    requires: dotnet-sdk
    probe: [Microsoft.NETFramework.ReferenceAssemblies.net20]
    versionPattern: '^(?<version>.+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://www.nuget.org/packages/Microsoft.NETFramework.ReferenceAssemblies.net20
  ref-net3-5:
    version: "1.0.3"
    kind: nuget
    requires: dotnet-sdk
    probe: [Microsoft.NETFramework.ReferenceAssemblies.net35]
    versionPattern: '^(?<version>.+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://www.nuget.org/packages/Microsoft.NETFramework.ReferenceAssemblies.net35
  ref-net4-6:
    version: "1.0.3"
    kind: nuget
    requires: dotnet-sdk
    probe: [Microsoft.NETFramework.ReferenceAssemblies.net46]
    versionPattern: '^(?<version>.+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://www.nuget.org/packages/Microsoft.NETFramework.ReferenceAssemblies.net46
  ref-net4-8:
    version: "1.0.3"
    kind: nuget
    requires: dotnet-sdk
    probe: [Microsoft.NETFramework.ReferenceAssemblies.net48]
    versionPattern: '^(?<version>.+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://www.nuget.org/packages/Microsoft.NETFramework.ReferenceAssemblies.net48
  ref-net8-0:
    version: "8.0.0"
    kind: nuget
    requires: dotnet-sdk
    probe: [Microsoft.NETCore.App.Ref]
    versionPattern: '^(?<version>.+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://www.nuget.org/packages/Microsoft.NETCore.App.Ref
  ref-netcoreapp3-1:
    version: "3.1.0"
    kind: nuget
    requires: dotnet-sdk
    probe: [Microsoft.NETCore.App.Ref]
    versionPattern: '^(?<version>.+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://www.nuget.org/packages/Microsoft.NETCore.App.Ref
  ref-netstandard2-0:
    version: "2.0.3"
    kind: nuget
    requires: dotnet-sdk
    probe: [NETStandard.Library]
    versionPattern: '^(?<version>.+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://www.nuget.org/packages/NETStandard.Library
  ref-netstandard2-1:
    version: "2.1.0"
    kind: nuget
    requires: dotnet-sdk
    probe: [NETStandard.Library.Ref]
    versionPattern: '^(?<version>.+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://www.nuget.org/packages/NETStandard.Library.Ref
  roslyn:
    version: "5.3.0"
    kind: nuget
    requires: dotnet-sdk
    probe: [Microsoft.CodeAnalysis.CSharp]
    versionPattern: '^(?<version>.+)$'
    platforms: [linux, windows, macos]
    licence: MIT
    source: https://www.nuget.org/packages/Microsoft.CodeAnalysis.CSharp
  ruby:
    version: "3.4.10"
    probe: [ruby, --version]
    versionPattern: '^ruby (?<version>\d+\.\d+\.\d+)'
    platforms: [linux, windows, macos]
    licence: Ruby OR BSD-2-Clause
    source: https://www.ruby-lang.org/en/downloads/
  rust:
    version: "1.99.0"
    probe: [cargo, --version]
    versionPattern: '^cargo (?<version>\d+\.\d+\.\d+)'
    platforms: [linux, windows, macos]
    licence: MIT OR Apache-2.0
    source: https://forge.rust-lang.org/infra/other-installation-methods.html
    roots: [RUSTUP_HOME, MIRI_SYSROOT]
  rust-miri:
    version: "nightly-2026-11-01"
    probe: [miri, --print, sysroot]
    versionPattern: '[\\/]toolchains[\\/](?<version>nightly-\d{4}-\d{2}-\d{2})-'
    platforms: [linux, windows, macos]
    licence: MIT OR Apache-2.0
    source: https://static.rust-lang.org/dist/2026-11-01/channel-rust-nightly.toml
