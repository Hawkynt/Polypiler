# The third-party works the repository contains or builds on, with their licences. Hand-edited;
# `polypiler-tooling licenses inventory` holds it against the repository:
#
#   notices   every THIRD-PARTY-NOTICE.* / THIRD_PARTY_NOTICES.* file outside bin, obj and dot-folders,
#             with the works it records (code converted from them, or files kept verbatim) and the
#             licence of each as an SPDX expression
#   packages  every PackageReference of a .csproj, .props or .targets file, by ID and version, with the
#             licence expression of the package's own manifest at that version
#
# A notice or package missing here is PLY0029, an entry nothing matches is PLY0026, and every licence
# must be allowed in distribution mode by policy.yaml (PLY0024). Adding a dependency or converting code
# therefore means adding its row here in the same change.
schema: 1

notices:
  - path: Polypiler.Core.Frontends.CSharp/THIRD_PARTY_NOTICES.md
    components:
      - { name: 'Roslyn (Microsoft.CodeAnalysis.CSharp 5.3.0)', licence: MIT }
