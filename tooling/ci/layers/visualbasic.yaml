# The Visual Basic layer: LibreOffice Basic in its VBA compatibility mode, run headless, the oracle of
# the classic VB6 / VBA frontend and backend (docs/adr/2600-classic-visual-basic-oracle.md), and the
# Visual Basic compiler and runtime of the pinned dotnet-sdk, the oracle of Visual Basic .NET, run by
# the job layer-visualbasic of .github/workflows/ci.yml. Format: spec/schemas/ci-layer.schema.json.
schema: 1
layer: visualbasic
toolchains: [libreoffice, dotnet-sdk]
os: [ubuntu-latest]
paths: ["Polypiler.Core.Frontends.VisualBasic/**", "Polypiler.Core.Backends.VisualBasic/**", "Polypiler.Core.Verification/Runners/VisualBasic*", "Polypiler.Core.Verification/Runners/VbNet*", "tests/fixtures/visualbasic/**", "tooling/ci/layers/visualbasic.yaml", "tooling/ci/visualbasic/**", "Polypiler.Tests.Acceptance/VisualBasic/**", "Polypiler.Tests/Frontends/VisualBasic/**", "Polypiler.Tests/Backends/VisualBasic/**"]
always: false
