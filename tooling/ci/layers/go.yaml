# The Go layer (PRD §7.3): the pinned go with gofmt and go vet, building, vetting and running the
# modules the Go backend writes and the helper the Go frontend parses and type-checks with, run by
# the job layer-go of .github/workflows/ci.yml. Format: spec/schemas/ci-layer.schema.json.
schema: 1
layer: go
toolchains: [go]
os: [ubuntu-latest]
paths: ["Polypiler.Core.Frontends.Go/**", "Polypiler.Core.Backends.Go/**", "tests/fixtures/go/**", "tooling/ci/layers/go.yaml", "Polypiler.Tests.Acceptance/Go/**", "Polypiler.Tests/Frontends/Go/**", "Polypiler.Tests/Backends/Go/**", "Polypiler.Tests/Backends/Support/GoFixtures.cs"]
always: false
