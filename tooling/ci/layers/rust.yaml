# The Rust layer (PRD §7.3): stable Rust with cargo fmt, clippy, cargo test and cargo run, and Miri on
# a dated nightly for crates with unsafe code, run by the job layer-rust of .github/workflows/ci.yml.
# Format: spec/schemas/ci-layer.schema.json.
schema: 1
layer: rust
toolchains: [rust, rust-miri]
os: [ubuntu-latest]
paths: ["Polypiler.Core.Frontends.Rust/**", "Polypiler.Core.Backends.Rust/**", "tests/fixtures/**/*.rs", "tests/fixtures/**/Cargo.toml", "tooling/ci/layers/rust.yaml", "Polypiler.Tests.Acceptance/Infra/Ci/Rust*", "tests/features/infra/infra-ci-rust.feature"]
always: false
