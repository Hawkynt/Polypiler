# The BASIC/PB layer (PRD §7.3), run by the job layer-basic of .github/workflows/ci.yml: PowerBASIC
# programs compiled by PB-Compiler at its pinned commit and run in DOSBox-X, the modules PB-Compiler
# emits checked by the pinned LLVM's assembler and verifier, the Commodore BASIC oracles (VICE and
# petcat, under xvfb-run) and the GW-BASIC oracle PC-BASIC. Which oracles actually run is
# tooling/ci/layers/basic.oracles.yaml. Format: spec/schemas/ci-layer.schema.json.
schema: 1
layer: basic
toolchains: [dotnet-sdk, git, pb-compiler, dosbox-x, llvm, vice, vice-x128, vice-xvic, petcat, xvfb-run, pcbasic]
os: [ubuntu-latest]
paths: ["Polypiler.Core.Frontends.PowerBasic/**", "Polypiler.Core.Backends.PowerBasic/**", "Polypiler.Core.Frontends.C64Basic/**", "Polypiler.Core.Backends.TokenizedBasic/**", "Polypiler.Core.Verification/Emulators/**", "tests/fixtures/**/*.bas", "tests/fixtures/**/*.BAS", "tests/fixtures/**/*.prg", "tests/fixtures/retro/**", "tests/fixtures/formats/llvm/**", "tooling/ci/layers/basic.*", "tooling/ci/basic/**", "Polypiler.Tests.Acceptance/Infra/Ci/**", "Polypiler.Tests.Acceptance/Retro/**", "Polypiler.Tests.Acceptance/Formats/Llvm/**", "tests/features/infra/infra-ci-basic.feature", "tests/features/retro/**", "tests/features/formats/fmt-llvm-audit.feature"]
always: false
