# The pinned upstream corpus (PRD §8 P0, §11): the repositories tests read from, each at one commit,
# and the fixtures taken from them. Hand-edited; the format is spec/schemas/corpus.schema.json.
#
#   polypiler-tooling corpus import [--source <checkout>]... [--update-lock] [--fixture <id>]...
#       writes the fixtures' files and every repository's licence files to
#       corpus/upstream/<owner>/<repo>@<commit>/ (git-ignored) and checks them against corpus.lock.json
#   polypiler-tooling corpus verify
#       re-hashes the imported files offline
#   polypiler-tooling corpus discover --repository <owner/repo> --glob <pattern>
#       prints fixture stubs for the files of a pin
#
# The repositories are the pin table of backlog/README.md. A fixture is added by the issue that first
# uses it; after adding one, run `corpus import --update-lock` and commit the lock with it.
schema: 1

repositories:
