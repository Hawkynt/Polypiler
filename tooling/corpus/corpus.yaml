fixtures:
  - id: cipher.checksum.adler32
    repository: Hawkynt/Hawkynt.github.io
    path: Cipher/algorithms/checksum/adler.js
    export: AdlerAlgorithm
    dependencies: [Cipher/OpCodes.js]
    run: [node, '{file}']
    vectors: { kind: embedded, source: "the tests of new AdlerAlgorithm('32')" }
    licence: LGPL-3.0-or-later
    determinism: deterministic
    tolerance: exact
    profiles: []
  - id: bitperm.page
    repository: Hawkynt/Hawkynt.github.io
    path: BitPerm/index.html
    export: BUILDING_BLOCKS, PRESETS, runBuildingBlockTests
    dependencies: [BitPerm/README.md]
    run: [node, tooling/bitperm/export.mjs, --page, '{file}', --out, tests/fixtures/bitperm, --check]
    vectors: { kind: embedded, source: "the tests of runBuildingBlockTests and the page's raw mapping evaluation" }
    licence: LGPL-3.0-or-later
    determinism: deterministic
    tolerance: exact
    profiles: []
  # FMT-LLVM-AUDIT (docs/llvm/pb-emitter-audit.md): the BASIC programs `pbc --emit-llvm` is
  # characterized on (tests/fixtures/formats/llvm/pb/characterization.yaml).
  - id: pb.llvm.mini
    repository: Hawkynt/PB-Compiler
    path: tests/MINI.BAS
    export: main
    dependencies: [tests/TESTLIB.BI]
    run: [pbc, --emit-llvm, '{file}']
    vectors: { kind: embedded, source: "llvm-as and opt -passes=verify accept the emitted module" }
    licence: LGPL-3.0-or-later
    determinism: deterministic
    tolerance: exact
    profiles: []
