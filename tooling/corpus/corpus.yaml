  # ADP-NCNN-LICENCE (spec/adapters/ncnn/licence-audit.yaml): the MediaDroid files the NCNN adapter's
  # licence audit records, grouped by the licence it records for them, and the notices it rests on.
  # Nothing here is built or run; sha256sum is the audit's oracle for the digests.
  - id: mediadroid.ncnn.own
    repository: Hawkynt/MediaDroid
    path: native/src/networks.cpp
    export: networks
    dependencies: [native/src/networks.h, native/src/pair_networks.cpp, native/src/enlarger.cpp, native/src/colorizer.cpp, native/src/shaders.cpp, native/src/shaders.h, native/jni/interpolator.cpp, native/CMakeLists.txt, native/build.gradle.kts]
    run: [sha256sum, '{file}']
    vectors: { kind: published, source: "the SHA-256 and length spec/adapters/ncnn/licence-audit.yaml records" }
    licence: LGPL-3.0-or-later
    determinism: deterministic
    tolerance: exact
    profiles: []
