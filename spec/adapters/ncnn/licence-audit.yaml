# The file-level licence audit of the NCNN adapter's native inputs (ADP-NCNN-LICENCE): one record per
# MediaDroid file at the pin that an issue of ADP-NCNN may compile, link or load, and one entry per
# component it needs that is not a file of the pin. Format: spec/schemas/adapter-audit.schema.json;
#
#   polypiler-tooling catalog audit-adapter --audit spec/adapters/ncnn/licence-audit.yaml [--touch <path>]...
#
# holds it against the imported corpus (tooling/corpus/corpus.yaml, fixtures mediadroid.ncnn.*).
# Every fact is read from the file's own header and the notice it names, at the pin; the digests are
# sha256sum's of the imported files. The licence scanner (licenses scan --mode corpus) finds no
# SPDX header in any of these files and falls back to the repository's LICENSE (LGPL-3.0) for all of
# them; it reports the model files and xvfi.cpp, whose terms come from their notices, as disagreeing
# with that LICENSE. Model weights are restricted assets of tooling/licensing/policy.yaml whatever
# their licence: kind 'model' marks them, and they may be touched only once ADP-NCNN-CLEARANCE
# grants the clearance below.
