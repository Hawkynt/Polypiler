    - {construct: "checked and unchecked arithmetic and conversions", family: scalars, state: supported}
    - {construct: "decimal", family: scalars, state: diagnosed, diagnostic: PLY1002}
    - {construct: "string", family: scalars, state: diagnosed, diagnostic: PLY1002}
    - {construct: "if, while, do, for and foreach over an array", family: control, state: supported}
    - {construct: "switch with constant labels", family: control, state: supported}
    - {construct: "goto statement", family: control, state: diagnosed, diagnostic: PLY1002}
    - {construct: "throw and try", family: control, state: diagnosed, diagnostic: PLY1002}
    - {construct: "one-dimensional arrays of the numeric types", family: memory, state: supported}
    - {construct: "multi-dimensional and jagged arrays", family: memory, state: diagnosed, diagnostic: PLY1002}
    - {construct: "static methods of one static class", family: functions, state: supported}
    - {construct: "lambda", family: functions, state: diagnosed, diagnostic: PLY1002}
    - {construct: "generic method", family: functions, state: diagnosed, diagnostic: PLY1002}
    - {construct: "ref and out parameters", family: functions, state: diagnosed, diagnostic: PLY1002}
    - {construct: "value records: struct, readonly struct, record struct", family: types, state: supported}
