id: RECOGNITION.O0102
title: Recognize population count from the SWAR mask-and-add sequence
version: 2
status: normative
owner: Hawkynt
issue: "#575"
tests:
  - Polypiler.Tests/Recognize/PopCountSwarRecognitionTests.cs
  - Polypiler.Tests/Verification/Proofs/SmtRecognitionProverTests.cs
  - tests/features/recognize/rec-popcount-swar.feature
  - Polypiler.Tests.Acceptance/Optimize/ArithmeticRecognitionSteps.cs
  - Polypiler.Tests/Recognize/RecognitionFixtureTests.cs
  - tests/fixtures/prototype/recognize/RecognizePopCountSwar.cs
  - tests/fixtures/prototype/recognize/popcountswar.js
introducedIn: P2
compatibility: additive
reviewedRevision: 2
normative: >-
  O0102 MUST recognize the SWAR population count in the structured tree IR of
  ADR 0009 by proof. A structural gate MUST select a candidate only when its
  root is a final fold, a right shift by at least 8 or a mask of at most 8
  bits, and the expression, through stable locals, holds the mask families
  0x55..., 0x33... and 0x0F...; other expressions MUST NOT be reported. A
  candidate reading more than one variable, one that may trap or act, one of
  more than 24 operations and one whose 0x55... masks are not of 16, 32 or 64
  bits MUST be refused with its reason. The host-supplied IRecognitionProver
  MUST then prove the actual candidate equal to PopCount of the counted
  value; a refuted proof MUST be reported as "not equivalent to PopCount".
  The CLI supplies SmtRecognitionProver, whose independent definition of
  PopCount sums every bit one at a time. The solver budget is five seconds.
  Missing, unknown, unsupported, unavailable, refuted and timed-out proofs
  MUST leave the candidate unchanged. Successful proof notes MUST be emitted
  only after the replacement is committed. A run of assignments MUST be
  replaced only where nothing reads its variable afterwards. --opt none and
  --disable-opt O0102 disable matching, proof requests and reports.
spec:
  optimization: O0102
  level: typed-tree
  pattern:
    before: "%a = Sub.u32 %x, And.u32(LShr.u32(%x, 1), 0x55555555); %b = Add.u32 And.u32(%a, 0x33333333), And.u32(LShr.u32(%a, 2), 0x33333333); %c = And.u32 Add.u32(%b, LShr.u32(%b, 4)), 0x0F0F0F0F; %r = LShr.u32 Mul.u32(%c, 0x01010101), 24"
    bindings:
      - {name: x, role: "counted value"}
  replacement:
    after: "%r = PopCount.u32 %x"
    introduces: [INTRINSICS.PopCount]
  preconditions:
    - {id: gate, text: "the root is a final fold and the expression holds the 0x55, 0x33 and 0x0F mask families", fact: none}
    - {id: one-variable, text: "the candidate reads exactly one variable", fact: none}
    - {id: size, text: "the candidate has at most 24 operations", fact: none}
    - {id: width, text: "the 0x55 masks are of 16, 32 or 64 bits", fact: type}
    - {id: run-dead, text: "a run of assignments is replaced only where nothing reads its variable afterwards", fact: none}
    - {id: trap-free, text: "the counted value has no effect and cannot trap: the replacement evaluates it once", fact: effect}
  proofObligations:
    - {id: popcount-swar-16, class: exhaustive-16bit, widths: [16]}
    - {id: popcount-swar-actual-candidate, class: smt-bitvector, widths: [16, 32, 64], budgetSeconds: 5}
  counterexamples:
    - description: "a wrong mask"
      input: "x = 0x00000004, u32, the second mask 0x33333332 instead of 0x33333333"
      naive: "PopCount(x) = 1"
      correct: "original = 0"
    - description: "32-bit masks over a 64-bit value"
      input: "x = 0x0000000100000000, u64, masks 0x55555555, 0x33333333, 0x0F0F0F0F"
      naive: "PopCount(x) = 1"
      correct: "original = 0"
    - description: "a final shift of 16 instead of 24"
      input: "x = 0x00000001, u32, (c * 0x01010101) >> 16"
      naive: "PopCount(x) = 1"
      correct: "original = 0x0101"
  switch: "--disable-opt O0102"
  optLevels: [default]
  document: docs/optimizations/O0102-popcount-swar-recognition.md
