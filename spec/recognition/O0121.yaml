id: RECOGNITION.O0121
title: Recognize wrapping absolute value from sign masks and compare-select
version: 2
status: normative
owner: Hawkynt
issue: "#555"
tests:
  - Polypiler.Tests/Recognize/AbsRecognitionTests.cs
  - Polypiler.Tests/Verification/Proofs/SmtRecognitionProverTests.cs
  - tests/features/recognize/rec-abs.feature
  - Polypiler.Tests.Acceptance/Optimize/ArithmeticRecognitionSteps.cs
  - Polypiler.Tests/Recognize/RecognitionFixtureTests.cs
  - tests/fixtures/prototype/recognize/RecognizeAbs.cs
  - tests/fixtures/prototype/recognize/abs.js
introducedIn: P2
compatibility: additive
reviewedRevision: 2
normative: >-
  O0121 MUST recognize signed wrapping magnitude at widths 8, 16, 32 and 64
  in the structured tree IR of ADR 0009. Sign-mask xor-subtract and add-xor
  forms, commuted operands, and signed comparisons with zero selecting the
  wrapping negation or the original value are supported. Narrow arithmetic
  MUST use the existing promoted operations and explicit conversions; its
  actual conversions MUST be proved. The replacement is AbsWrap, never Abs,
  and MUST preserve the smallest value. Masks MUST resolve through stable
  definitions and signed casts to the same arithmetic sign shift of the
  same value. Checked arithmetic, logical shifts, unsigned comparisons and
  operands that may trap or act MUST be refused. The host-supplied
  IRecognitionProver MUST prove the actual candidate equivalent to its
  replacement. The CLI supplies SmtRecognitionProver, whose independent
  definition uses signed comparison and modular negation, not the mask
  matcher; unsigned AbsWrap is identity. The solver budget is five seconds.
  Missing, unknown, unsupported, unavailable, refuted and timed-out proofs
  MUST leave the candidate unchanged and MUST NOT enter the proved cache.
  Library hosts MUST supply OptimizerOptions.Prover. Successful proof notes
  MUST be emitted only after the replacement is committed. --opt none and
  --disable-opt O0121 disable matching, proof requests and reports.
spec:
  optimization: O0121
  level: typed-tree
  pattern:
    before: "%m = AShr.i32 %x, 31; %r = Sub.i32 Xor.i32(%x, %m), %m"
    bindings:
      - {name: x, role: "signed value"}
  replacement:
    after: "%r = AbsWrap.i32 %x"
    introduces: [INTRINSICS.AbsWrap]
  preconditions:
    - {id: sign-mask, text: "both mask uses resolve to the same arithmetic sign shift of x, at the original or promoted carrier sign position", fact: known-bits}
    - {id: wrapping, text: "negation and subtraction wrap; checked arithmetic is refused", fact: effect}
    - {id: selects-magnitude, text: "a signed comparison with zero selects the wrapping negation for negative x and x otherwise", fact: none}
    - {id: signed-width, text: "the result and recovered value are signed integers of 8, 16, 32 or 64 bits, with any promotion and truncation preserved by proof", fact: type}
    - {id: trap-free, text: "the value has no effect and cannot trap", fact: effect}
  proofObligations:
    - {id: abs-exhaustive, class: exhaustive-8bit, widths: [8]}
    - {id: abs-actual-candidate, class: smt-bitvector, widths: [8, 16, 32, 64], budgetSeconds: 5}
  counterexamples:
    - description: "a shift below the sign position"
      input: "x = 0x40000001, i32, m = x >> 30, (x ^ m) - m"
      naive: "AbsWrap(x) = 0x40000001"
      correct: "original = 0x3FFFFFFF"
    - description: "checked negation"
      input: "x = 0x80000000, i32, x < 0 ? checked(-x) : x"
      naive: "AbsWrap(x) = 0x80000000"
      correct: "trap overflow"
    - description: "unsigned comparison"
      input: "x = 0xFFFFFFFE, i32, (u32)x < 0 ? -x : x"
      naive: "AbsWrap(x) = 2"
      correct: "original = -2"
    - description: "truncating the input changes the operation"
      input: "x = 129, i32, (i8)(x < 0 ? -x : x)"
      naive: "AbsWrap.i8((i8)x) = 127"
      correct: "original = -127"
  switch: "--disable-opt O0121"
  optLevels: [default]
  document: docs/optimizations/O0121-abs-recognition.md
