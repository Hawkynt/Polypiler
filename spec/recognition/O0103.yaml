id: RECOGNITION.O0103
title: Recognize leading and trailing zero counts from bit-scanning loops
version: 2
status: normative
owner: Hawkynt
issue: "#584"
tests:
  - Polypiler.Tests/Recognize/ZeroCountLoopRecognitionTests.cs
  - Polypiler.Tests/Verification/Proofs/SmtRecognitionProverTests.cs
  - tests/features/recognize/rec-zerocount-loop.feature
  - Polypiler.Tests.Acceptance/Optimize/ArithmeticRecognitionSteps.cs
  - Polypiler.Tests/Recognize/RecognitionFixtureTests.cs
  - tests/fixtures/prototype/recognize/RecognizeZeroCount.cs
  - tests/fixtures/prototype/recognize/zerocount.js
introducedIn: P2
compatibility: additive
reviewedRevision: 2
normative: >-
  O0103 MUST recognize bit-scanning loops over values of 8, 16, 32 and 64 bits
  in the structured tree IR of ADR 0009: the guarded loop
  n = 0; while (n < w && bit == 0) whose test reads bit n (or w - 1 - n) of one
  value in every pass, the same loop without the bound only where the value is
  known to be non-zero from a dominating if (x == 0) return or an enclosing
  if (x != 0) with nothing in between mentioning x, and the bit-length loop
  while (v != 0) { v >>>= 1; n++; } with a logical shift, which becomes
  w - LeadingZeroCount(v). The counter MUST start at 0 and step by one; the body
  MAY shift one variable by one and MUST do nothing else. The loop MUST be
  unrolled symbolically into the chain of its passes' exit values, and the
  host-supplied IRecognitionProver MUST prove the final counter equal to the
  count and the final shifted variable equal to the value shifted by the count,
  under the non-zero fact for the unguarded form; the bit-length form MUST show
  that the shifted value is zero after w passes. An unguarded loop whose input
  may be zero, an arithmetic shift in the bit-length form, a bound other than
  the width, a body with effects and any other loop shape MUST be refused with
  their reasons. The CLI supplies SmtRecognitionProver, whose independent
  definitions test every bit position. The solver budget is five seconds.
  Missing, unknown, unsupported, unavailable, refuted and timed-out proofs MUST
  leave the loop unchanged. Successful proof notes MUST be emitted only after
  the replacement is committed. --opt none and --disable-opt O0103 disable
  matching, proof requests and reports.
spec:
  optimization: O0103
  level: typed-tree
  pattern:
    before: "%n = 0; while (And.bool(Lt.i32(%n, 32), Eq.u32(And.u32(%x, 1), 0))) { %x = LShr.u32 %x, 1; %n = Add.i32 %n, 1 }"
    bindings:
      - {name: x, role: "scanned value"}
      - {name: n, role: "counter"}
  replacement:
    after: "%n = TrailingZeroCount.u32 %x; %x = LShr.u32 %x, %n"
    introduces: [INTRINSICS.TrailingZeroCount, INTRINSICS.LeadingZeroCount]
  preconditions:
    - {id: counted, text: "the counter starts at 0 right before the loop and steps by one; the body shifts at most one variable by one and does nothing else", fact: effect}
    - {id: one-bit-per-pass, text: "in every pass r the test reads bit r, or bit w - 1 - r, of one value from before the loop", fact: known-bits}
    - {id: bound-is-width, text: "the guarded form's bound is exactly the width of the scanned value", fact: none}
    - {id: non-zero, text: "the unguarded form's value is non-zero: a dominating if (x == 0) return or an enclosing if (x != 0)", fact: range}
    - {id: logical-shift, text: "the bit-length form shifts logically, so the value is zero after w passes", fact: known-bits}
  proofObligations:
    - {id: zero-count-exhaustive, class: exhaustive-8bit, widths: [8]}
    - {id: zero-count-actual-loop, class: smt-bitvector, widths: [8, 16, 32, 64], budgetSeconds: 5}
  counterexamples:
    - description: "an unguarded loop whose input may be zero"
      input: "x = 0, u32, while ((x & 1) == 0) { x >>= 1; n++; }"
      naive: "TrailingZeroCount(x) = 32"
      correct: "original does not end"
    - description: "a bit-length loop with an arithmetic shift"
      input: "v = 0x80000000, i32, while (v != 0) { v >>= 1; n++; }"
      naive: "32 - LeadingZeroCount(v) = 32"
      correct: "original does not end"
    - description: "a bound other than the width"
      input: "x = 0x80000000, u32, while (n < 31 && ((x >> n) & 1) == 0) n++"
      naive: "TrailingZeroCount(x) = 31"
      correct: "original = 31, and x = 0 gives 31 against 32"
    - description: "a scan from bit 1"
      input: "x = 1, u32, n = 1; while (n < 32 && ((x >> n) & 1) == 0) n++"
      naive: "TrailingZeroCount(x) = 0"
      correct: "original = 32"
  switch: "--disable-opt O0103"
  optLevels: [default]
  document: docs/optimizations/O0103-zero-count-loop-recognition.md
