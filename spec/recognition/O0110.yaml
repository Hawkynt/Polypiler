id: RECOGNITION.O0110
title: Recognize parity from xor folding and PopCount
version: 1
status: draft
owner: Hawkynt
issue: "#573"
tests:
  - Polypiler.Tests/Recognize/RecognitionFixtureTests.cs
  - tests/fixtures/prototype/recognize/RecognizeParity.cs
  - tests/fixtures/prototype/recognize/parity.js
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: >-
  An exclusive-or fold, or PopCount(x) & 1, MUST become Parity only when bit 0 of its value is the
  exclusive or of every bit of one value and every other bit is zero. The prototype rule O0110Parity
  in Polypiler.Core.Recognize matches the structured IR of Polypiler.Core.IR, not the typed SSA IR:
  pattern.before and replacement.after are written in that structured form, and matching typed SSA
  graphs belongs to REC-ENGINE (#276). RecognitionFixtureTests is the evidence the prototype has: it
  checks that the rule fires exactly on the marked functions of its fixtures, that --disable-opt O0110
  keeps it from firing, and that the IR interpreter computes the same before and after the rule -
  result, kind of trap and the arrays a trap leaves behind - for every value of each 8- and 16-bit
  parameter and for the edges and 10 000 random tuples of the wider ones. The proof obligations below
  are planned and not discharged yet: exhaustive checks with VER-EXHAUSTIVE (#70), bit-vector proofs
  with VER-SMT (#71). The prototype knows only the levels default, where the rule is on, and none; the
  optLevels name the levels of the target state. The document stays a draft until its obligations are
  discharged.
spec:
  optimization: O0110
  level: typed-ssa
  pattern:
    before: "%a = Xor.u32 %x, LShr.u32(%x, 16); %b = Xor.u32 %a, LShr.u32(%a, 8); %c = Xor.u32 %b, LShr.u32(%b, 4); %d = Xor.u32 %c, LShr.u32(%c, 2); %e = Xor.u32 %d, LShr.u32(%d, 1); %r = And.u32 %e, 1"
    bindings:
      - {name: x, role: "folded value"}
  replacement:
    after: "%r = Parity.u32 %x"
    introduces: [INTRINSICS.Parity]
  preconditions:
    - {id: every-bit, text: "bit 0 is the exclusive or of every bit of one value", fact: known-bits}
    - {id: other-bits-zero, text: "every bit but bit 0 is zero: the fold ends with & 1", fact: known-bits}
    - {id: run-dead, text: "a run of assignments is replaced only where nothing reads its variable afterwards", fact: none}
    - {id: trap-free, text: "the folded value has no effect and cannot trap: the replacement evaluates it once", fact: effect}
  proofObligations:
    - {id: parity-8, class: exhaustive-8bit, widths: [8]}
    - {id: parity-16, class: exhaustive-16bit, widths: [16]}
    - {id: parity-wide, class: smt-bitvector, widths: [32, 64], budgetSeconds: 10}
  counterexamples:
    - description: "a fold that skips a step"
      input: "x = 0x00010000, u32, the fold without x ^= x >> 16, then & 1"
      naive: "0"
      correct: "1"
    - description: "a fold without the final mask"
      input: "x = 0x00000003, u32, the full fold without & 1"
      naive: "0x00000002"
      correct: "0x00000000"
  switch: "--disable-opt O0110"
  optLevels: [balanced, speed, size, memory]
  document: docs/optimizations/O0110-parity-recognition.md
