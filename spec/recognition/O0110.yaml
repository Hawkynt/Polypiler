id: RECOGNITION.O0110
title: Recognize parity from xor folding, the nibble table and PopCount
version: 2
status: normative
owner: Hawkynt
issue: "#573"
tests:
  - Polypiler.Tests/Recognize/ParityRecognitionTests.cs
  - Polypiler.Tests/Verification/Proofs/SmtRecognitionProverTests.cs
  - tests/features/recognize/rec-parity.feature
  - Polypiler.Tests.Acceptance/Optimize/ArithmeticRecognitionSteps.cs
  - Polypiler.Tests/Recognize/RecognitionFixtureTests.cs
  - tests/fixtures/prototype/recognize/RecognizeParity.cs
  - tests/fixtures/prototype/recognize/parity.js
introducedIn: P2
compatibility: additive
reviewedRevision: 2
normative: >-
  O0110 MUST recognize the parity of integers of widths 8, 16, 32 and 64 in the
  structured tree IR of ADR 0009, from the exclusive-or fold in one expression
  or as a run of assignments, from the fold to a nibble read through the table
  0x6996 as (0x6996 >> (y & 15)) & 1, and from PopCount(x) & 1. The fold is
  evaluated bit by bit as exclusive ors of atom bits; it is the parity when bit
  0 is the exclusive or of every bit of one value, or of its low 8, 16 or 32
  bits, and every other bit is zero. The replacement is the Parity intrinsic,
  not And(PopCount(x), 1): the IR has a parity operation, which every backend
  writes. A fold-shaped expression of one value under a mask of 1 to 3 that is
  not its parity - a skipped step, a wider mask, another table - MUST be
  refused as "not equivalent to parity", and a fold larger than 4 log2 w + 4
  operations as "expression too large". The host-supplied IRecognitionProver
  MUST prove the actual candidate equivalent to its replacement. The CLI
  supplies SmtRecognitionProver, whose definitions are the halving fold with
  logical shifts for Parity and a sum of the isolated bits for PopCount, and
  which shares no code with the recognizer. The solver budget is five
  seconds. Missing, unknown, unsupported, unavailable, refuted and timed-out
  proofs MUST leave the candidate unchanged. Successful proof notes MUST be
  emitted only after the replacement is committed. --opt none and
  --disable-opt O0110 disable matching, proof requests and reports.
spec:
  optimization: O0110
  level: typed-tree
  pattern:
    before: "%a = Xor.u32 %x, LShr.u32(%x, 16); %b = Xor.u32 %a, LShr.u32(%a, 8); %c = Xor.u32 %b, LShr.u32(%b, 4); %d = Xor.u32 %c, LShr.u32(%c, 2); %e = Xor.u32 %d, LShr.u32(%d, 1); %r = And.u32 %e, 1"
    bindings:
      - {name: x, role: "folded value"}
  replacement:
    after: "%r = Parity.u32 %x"
    introduces: [INTRINSICS.Parity]
  preconditions:
    - {id: every-bit, text: "bit 0 is the exclusive or of every bit of one value, or of its low 8, 16 or 32 bits", fact: known-bits}
    - {id: other-bits-zero, text: "every bit but bit 0 is zero: the fold ends with & 1", fact: known-bits}
    - {id: parity-table, text: "a nibble lookup reads the table 0x6996, whose entry v is the parity of v", fact: none}
    - {id: bounded-size, text: "the fold has at most 4 log2 w + 4 operations", fact: none}
    - {id: run-dead, text: "a run of assignments is replaced only where nothing reads its variable afterwards", fact: none}
    - {id: trap-free, text: "the folded value has no effect and cannot trap: the replacement evaluates it once", fact: effect}
  proofObligations:
    - {id: parity-exhaustive, class: exhaustive-8bit, widths: [8]}
    - {id: parity-actual-candidate, class: smt-bitvector, widths: [8, 16, 32, 64], budgetSeconds: 5}
  counterexamples:
    - description: "a fold that skips a step"
      input: "x = 0x00000010, u32, the fold without x ^= x >> 4, then & 1"
      naive: "Parity(x) = 1"
      correct: "original = 0"
    - description: "the complement table"
      input: "x = 0x01, u8, (0x9669 >> ((x ^ (x >> 4)) & 15)) & 1"
      naive: "Parity(x) = 1"
      correct: "original = 0"
    - description: "a final mask of 3"
      input: "x = 0x00000003, u32, the full fold, then & 3"
      naive: "Parity(x) = 0"
      correct: "original = 2"
    - description: "a fold without the final mask"
      input: "x = 0x00000003, u32, the full fold without & 1"
      naive: "Parity(x) = 0"
      correct: "original = 2"
  switch: "--disable-opt O0110"
  optLevels: [default]
  document: docs/optimizations/O0110-parity-recognition.md
