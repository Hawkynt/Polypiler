id: RECOGNITION.O0105
title: Recognize bit reversal from swap cascades and shift loops
version: 2
status: normative
owner: Hawkynt
issue: "#557"
tests:
  - Polypiler.Tests/Recognize/PermutationRecognitionTests.cs
  - Polypiler.Tests/Verification/Proofs/SmtRecognitionProverTests.cs
  - tests/features/recognize/rec-bitreverse.feature
  - Polypiler.Tests/Recognize/RecognitionFixtureTests.cs
  - tests/fixtures/prototype/recognize/RecognizeBitReverse.cs
  - tests/fixtures/prototype/recognize/bitreverse.js
introducedIn: P2
compatibility: additive
reviewedRevision: 2
normative: >-
  O0105 MUST recognize complete bit reversals at 8, 16, 32 and 64 bits in the
  structured tree IR of ADR 0009. Exact weighted-bit provenance MUST establish
  that each output bit is the reversed input bit. Swap cascades containing the
  alternating-bit mask MUST contain at most 8*log2(width) distinct instructions;
  stable definitions and shared nodes count once. All cascade step orders and
  an explicit final rotation are supported. Counted loops MUST be pure and
  their unrolled final assignments MUST preserve every live local, including
  the source's sign-filled exit value and the final counter. Before replacing
  either form the host-supplied IRecognitionProver MUST prove the actual
  candidate equivalent to BitReverse; the CLI supplies SmtRecognitionProver.
  Timeout, unknown, unsupported or unavailable proofs MUST leave the candidate
  unchanged and MUST NOT be cached as proved. The proof budget is five seconds.
  Library hosts MUST supply OptimizerOptions.Prover to enable this rule. The
  default CLI level enables it; --opt none or --disable-opt O0105 disables it.
  The exhaustive prover checks the 8-bit obligation independently of the SMT
  checks, and seeded interpreter comparisons check the original and result.
spec:
  optimization: O0105
  level: typed-tree
  pattern:
    before: "%a = Or.u32 And.u32(LShr.u32(%x, 1), 0x55555555), Shl.u32(And.u32(%x, 0x55555555), 1); %b = Or.u32 And.u32(LShr.u32(%a, 2), 0x33333333), Shl.u32(And.u32(%a, 0x33333333), 2); %c = Or.u32 And.u32(LShr.u32(%b, 4), 0x0F0F0F0F), Shl.u32(And.u32(%b, 0x0F0F0F0F), 4); %d = Or.u32 And.u32(LShr.u32(%c, 8), 0x00FF00FF), Shl.u32(And.u32(%c, 0x00FF00FF), 8); %r = Or.u32 LShr.u32(%d, 16), Shl.u32(%d, 16)"
    bindings:
      - {name: x, role: "reversed value"}
  replacement:
    after: "%r = BitReverse.u32 %x"
    introduces: [INTRINSICS.BitReverse]
  preconditions:
    - {id: exact-reversal, text: "the result is exactly the bits of one value, bit j on bit w - 1 - j", fact: known-bits}
    - {id: whole-loop, text: "a loop runs w passes, its result starts at 0 or shifts all its old bits out, and every other variable it writes ends as a constant or one shift of its old value", fact: range}
    - {id: trap-free, text: "the reversed value has no effect and cannot trap: the replacement evaluates it once", fact: effect}
  proofObligations:
    - {id: bit-reverse-8, class: exhaustive-8bit, widths: [8]}
    - {id: bit-reverse-16, class: exhaustive-16bit, widths: [16]}
    - {id: bit-reverse-wide, class: smt-bitvector, widths: [16, 32, 64], budgetSeconds: 5}
  counterexamples:
    - description: "a cascade without the swap of halves"
      input: "x = 0x00000001, u32, the first four steps of the 32-bit cascade"
      naive: "0x00008000"
      correct: "0x80000000"
    - description: "a loop of fewer passes than the width"
      input: "x = 0x00000001, u32, for (i = 0; i < 16; i++) { r = (r << 1) | (x & 1); x >>= 1; }"
      naive: "0x00008000"
      correct: "0x80000000"
  switch: "--disable-opt O0105"
  optLevels: [default]
  document: docs/optimizations/O0105-bit-reverse-recognition.md
