id: INTRINSICS.MaskToLowestSet
title: Mask up to the lowest set bit
version: 1
status: draft
owner: Hawkynt
issue: INT-BITFIELD
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: MaskToLowestSet
  group: Bitfield
  typeParameters: [{name: T, constraint: integer}]
  parameters: [{name: value, type: T}]
  returns: [{name: result, type: T}]
  legality: []
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "value ^ (value - 1) modulo 2^width: the bits up to and including the lowest 1 bit; all ones for 0"
    source: "H. S. Warren, Hacker's Delight, 2nd ed., section 2-1"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {T: TYPES.u32}, inputs: ["0x00000000"], outputs: ["0xFFFFFFFF"]}
    - {types: {T: TYPES.u32}, inputs: ["0x00000058"], outputs: ["0x0000000F"]}
    - {types: {T: TYPES.u8}, inputs: ["0x80"], outputs: ["0xFF"]}
