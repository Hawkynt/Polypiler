id: INTRINSICS.TestBit
title: Test one bit
version: 1
status: draft
owner: Hawkynt
issue: INT-BITFIELD
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: TestBit
  group: Bitfield
  typeParameters: [{name: T, constraint: integer}]
  parameters: [{name: value, type: T}, {name: position, type: TYPES.i32}]
  returns: [{name: set, type: TYPES.bool}]
  legality:
    - {id: position-in-width, text: "position is at least 0 and below the width of T; otherwise the operation traps with an invalid operation", fact: range}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "((value >> position) & 1) = 1 on the bit pattern of value"
    source: "H. S. Warren, Hacker's Delight, 2nd ed., section 2-1"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {T: TYPES.u32}, inputs: ["0x80000000", 31], outputs: [1]}
    - {types: {T: TYPES.u32}, inputs: ["0x80000000", 30], outputs: [0]}
    - {types: {T: TYPES.i8}, inputs: [-128, 7], outputs: [1]}
