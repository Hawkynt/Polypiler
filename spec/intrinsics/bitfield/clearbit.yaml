id: INTRINSICS.ClearBit
title: Clear one bit
version: 1
status: draft
owner: Hawkynt
issue: INT-BITFIELD
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: ClearBit
  group: Bitfield
  typeParameters: [{name: T, constraint: integer}]
  parameters: [{name: value, type: T}, {name: position, type: TYPES.i32}]
  returns: [{name: result, type: T}]
  legality:
    - {id: position-in-width, text: "position is at least 0 and below the width of T; otherwise the operation traps with an invalid operation", fact: range}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "value & ~(1 << position)"
    source: "H. S. Warren, Hacker's Delight, 2nd ed., section 2-1"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {T: TYPES.u32}, inputs: ["0xFFFFFFFF", 31], outputs: ["0x7FFFFFFF"]}
    - {types: {T: TYPES.u32}, inputs: ["0x00000000", 5], outputs: ["0x00000000"]}
    - {types: {T: TYPES.i8}, inputs: [-1, 7], outputs: [127]}
