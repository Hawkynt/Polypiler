id: INTRINSICS.ZeroExtend
title: Zero-extend the low bits
version: 1
status: draft
owner: Hawkynt
issue: INT-BITFIELD
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: ZeroExtend
  group: Bitfield
  typeParameters: [{name: T, constraint: integer}]
  parameters: [{name: value, type: T}, {name: bits, type: TYPES.i32}]
  returns: [{name: result, type: T}]
  legality:
    - {id: bits-in-width, text: "bits is at least 1 and at most the width of T; otherwise the operation traps with an invalid operation", fact: range}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "value & ((1 << bits) - 1): the lowest bits bits of value with 0 above"
    source: "H. S. Warren, Hacker's Delight, 2nd ed., section 2-1"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {T: TYPES.i32}, inputs: [-1, 8], outputs: [255]}
    - {types: {T: TYPES.u32}, inputs: ["0x12345678", 16], outputs: ["0x00005678"]}
    - {types: {T: TYPES.i8}, inputs: [-1, 8], outputs: [-1]}
