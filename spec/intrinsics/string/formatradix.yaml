id: INTRINSICS.FormatRadix
title: An integer in a radix, padded with zeros
version: 1
status: draft
owner: Hawkynt
issue: "#1315"
tests: [Polypiler.Tests/String/IrNumberTextTests.cs]
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: FormatRadix
  group: String
  typeParameters: [{name: T, constraint: integer}]
  parameters: [{name: value, type: T}, {name: radix, type: TYPES.i32}, {name: minDigits, type: TYPES.i32}, {name: upper, type: TYPES.bool}, {name: mode, type: TYPES.i32}]
  returns: [{name: text, type: TYPES.str}]
  legality:
    - {id: constants, text: "radix, minDigits, upper and mode are constants; mode 0 takes radix 2, 8 or 16, mode 1 radix 2 to 36; minDigits is 0 to 99", fact: none}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "the digits of value in radix, padded with zeros to minDigits, letters in upper case where upper is set; mode 0 (two's complement, radix 2, 8 or 16) writes the bits of T read as unsigned, mode 1 (sign and magnitude, radix 2 to 36) a minus sign before the digits of the magnitude"
    source: ".NET API reference, Int32.ToString(String) with x and D, Convert.ToString(Int32, Int32); ECMA-262 2022 §21.1.3.6 (Number.prototype.toString)"
  mustSurviveUntil: IR.stage.legalized-target
  requiresRuntime: true
  vectors:
    - {types: {T: TYPES.i32}, inputs: [-1, 16, 0, 0, 0], outputs: [[102, 102, 102, 102, 102, 102, 102, 102]]}
    - {types: {T: TYPES.i32}, inputs: [-1, 16, 0, 0, 1], outputs: [[45, 49]]}
    - {types: {T: TYPES.i32}, inputs: [-5, 10, 3, 0, 1], outputs: [[45, 48, 48, 53]]}
    - {types: {T: TYPES.u8}, inputs: [255, 16, 4, 1, 0], outputs: [[48, 48, 70, 70]]}
