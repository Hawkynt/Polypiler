id: INTRINSICS.StrRepeat
title: A string or a code unit repeated
version: 1
status: draft
owner: Hawkynt
issue: "#1314"
tests: [Polypiler.Tests/String/IrStringTests.cs]
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: StrRepeat
  group: String
  typeParameters: [{name: T, constraint: any}]
  parameters: [{name: value, type: T}, {name: count, type: TYPES.i32}]
  returns: [{name: text, type: TYPES.str}]
  legality:
    - {id: count-not-negative, text: "count is not negative; a negative count traps IntegerOverflow", fact: range}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "value, a string or a code unit, count times in a row"
    source: "ECMA-262 2022 §22.1.3.16 (repeat); the .NET API reference of System.String(Char, Int32)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {T: TYPES.str}, inputs: [[97, 98], 3], outputs: [[97, 98, 97, 98, 97, 98]]}
    - {types: {T: TYPES.str}, inputs: [[97, 98], 0], outputs: [[]]}
    - {types: {T: TYPES.u16}, inputs: [120, 2], outputs: [[120, 120]]}
