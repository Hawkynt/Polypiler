id: INTRINSICS.StrSplit
title: Parts between the occurrences of a separator
version: 1
status: draft
owner: Hawkynt
issue: "#1314"
tests: [Polypiler.Tests/String/IrStringTests.cs]
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: StrSplit
  group: String
  typeParameters: [{name: N, constraint: any}]
  parameters: [{name: text, type: TYPES.str}, {name: separator, type: N}, {name: limit, type: TYPES.i32}]
  returns: [{name: parts, type: "TYPES.str[]"}]
  legality: []
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "the parts of text between the occurrences of separator, a string or a code unit, at most limit of them when limit is not negative; an empty separator splits between every two code units"
    source: "ECMA-262 2022 §22.1.3.22 (split with a string separator)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {N: TYPES.str}, inputs: [[97, 44, 98, 44, 44, 99], [44], -1], outputs: [[[97], [98], [], [99]]]}
    - {types: {N: TYPES.str}, inputs: [[], [44], -1], outputs: [[[]]]}
    - {types: {N: TYPES.str}, inputs: [[97, 98, 99], [], 2], outputs: [[[97], [98]]]}
    - {types: {N: TYPES.u16}, inputs: [[97, 32, 98], 32, -1], outputs: [[[97], [98]]]}
