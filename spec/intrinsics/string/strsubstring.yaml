id: INTRINSICS.StrSubstring
title: A range of a string
version: 1
status: draft
owner: Hawkynt
issue: "#1314"
tests: [Polypiler.Tests/String/IrStringTests.cs]
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: StrSubstring
  group: String
  typeParameters: []
  parameters: [{name: text, type: TYPES.str}, {name: start, type: TYPES.i32}, {name: length, type: TYPES.i32}]
  returns: [{name: part, type: TYPES.str}]
  legality:
    - {id: range-in-string, text: "start and length are not negative and start + length is at most the length of text; otherwise it traps IndexOutOfRange", fact: range}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "the code units text[start] to text[start + length - 1]; without length, up to the end"
    source: "the .NET API reference of System.String.Substring(Int32, Int32)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {}, inputs: [[97, 98, 99, 100, 101, 102], 1, 3], outputs: [[98, 99, 100]]}
    - {types: {}, inputs: [[97, 98, 99], 3, 0], outputs: [[]]}
    - {types: {}, inputs: [[97, 55357, 56832], 0, 2], outputs: [[97, 55357]]}
