id: INTRINSICS.StrLastIndexOf
title: Last position of a needle
version: 1
status: draft
owner: Hawkynt
issue: "#1314"
tests: [Polypiler.Tests/String/IrStringTests.cs]
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: StrLastIndexOf
  group: String
  typeParameters: [{name: N, constraint: any}]
  parameters: [{name: text, type: TYPES.str}, {name: needle, type: N}, {name: from, type: TYPES.i32}]
  returns: [{name: position, type: TYPES.i32}]
  legality:
    - {id: from-in-string, text: "from is within [0, length]; otherwise it traps IndexOutOfRange", fact: range}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "the last start at or before from at which needle, a string or a code unit, stands in text, or -1; an empty needle stands at from; without from, from the length"
    source: "ECMA-262 2022 §22.1.3.10 (lastIndexOf)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {N: TYPES.str}, inputs: [[97, 98, 99, 97, 98, 99], [98, 99], 6], outputs: [4]}
    - {types: {N: TYPES.str}, inputs: [[97, 98, 99, 97, 98, 99], [98, 99], 3], outputs: [1]}
    - {types: {N: TYPES.u16}, inputs: [[97, 98, 97, 98], 98, 4], outputs: [3]}
