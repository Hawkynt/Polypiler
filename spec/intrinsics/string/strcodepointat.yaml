id: INTRINSICS.StrCodePointAt
title: Code point at an index
version: 1
status: draft
owner: Hawkynt
issue: "#1314"
tests: [Polypiler.Tests/String/IrStringTests.cs]
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: StrCodePointAt
  group: String
  typeParameters: []
  parameters: [{name: text, type: TYPES.str}, {name: index, type: TYPES.i32}]
  returns: [{name: point, type: TYPES.i32}]
  legality:
    - {id: index-in-range, text: "index is within [0, length); outside it traps IndexOutOfRange", fact: range}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "a high surrogate followed by a low one as the code point of the pair, any other code unit, a lone surrogate too, as its value"
    source: "ECMA-262 2022 §22.1.3.3 (codePointAt)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {}, inputs: [[97, 55357, 56832], 1], outputs: [128512]}
    - {types: {}, inputs: [[97, 55357, 56832], 2], outputs: [56832]}
    - {types: {}, inputs: [[55296, 120], 0], outputs: [55296]}
