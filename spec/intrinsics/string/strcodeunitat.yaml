id: INTRINSICS.StrCodeUnitAt
title: Code unit of a string at an index
version: 1
status: draft
owner: Hawkynt
issue: "#1314"
tests: [Polypiler.Tests/String/IrStringTests.cs]
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: StrCodeUnitAt
  group: String
  typeParameters: []
  parameters: [{name: text, type: TYPES.str}, {name: index, type: TYPES.i32}]
  returns: [{name: unit, type: TYPES.u16}]
  legality:
    - {id: index-in-range, text: "index is within [0, length); outside it traps IndexOutOfRange", fact: range}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "the code unit of text at index"
    source: "ECMA-262 2022 §22.1.3.1 (charCodeAt); the .NET API reference of System.String.Chars[Int32]"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {}, inputs: [[97, 98, 99], 1], outputs: [98]}
    - {types: {}, inputs: [[97, 55357, 56832], 1], outputs: [55357]}
    - {types: {}, inputs: [[97, 55357, 56832], 2], outputs: [56832]}
