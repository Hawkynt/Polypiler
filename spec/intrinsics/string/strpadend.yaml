    - {types: {}, inputs: [[120], 1, [97, 98]], outputs: [[120]]}
    - {types: {}, inputs: [[120], 5, []], outputs: [[120]]}
    - {types: {}, inputs: [[120], -1, [97, 98]], outputs: [[120]]}
