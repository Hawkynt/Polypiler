id: INTRINSICS.StrPadEnd
title: A string padded at the end
version: 1
status: draft
owner: Hawkynt
issue: "#1314"
tests: [Polypiler.Tests/String/IrStringTests.cs]
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: StrPadEnd
  group: String
  typeParameters: []
  parameters: [{name: text, type: TYPES.str}, {name: length, type: TYPES.i32}, {name: filler, type: TYPES.str}]
  returns: [{name: result, type: TYPES.str}]
  legality: []
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "filler repeated behind text up to length code units, the last copy cut to fit; text itself when it is that long already or filler is empty"
    source: "ECMA-262 2022 §22.1.3.15 and §22.1.3.14 (padStart, padEnd)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
