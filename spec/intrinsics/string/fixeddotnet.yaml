id: INTRINSICS.FixedDotNet
title: Fixed notation as .NET writes F<n>
version: 1
status: draft
owner: Hawkynt
issue: "#1315"
tests: [Polypiler.Tests/String/IrNumberTextTests.cs]
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: FixedDotNet
  group: String
  typeParameters: []
  parameters: [{name: value, type: TYPES.f64}, {name: digits, type: TYPES.i32}]
  returns: [{name: text, type: TYPES.str}]
  legality:
    - {id: digits-constant, text: "digits is a constant from 0 to 15", fact: none}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "the exact value rounded to digits after the point, a tie to the even digit, never an exponent; the sign of a negative number stays, also of -0"
    source: ".NET API reference, Standard numeric format strings (F); .NET Core 3.0 formats the exact value"
  mustSurviveUntil: IR.stage.legalized-target
  requiresRuntime: true
  vectors:
    - {types: {}, inputs: ["0x4004000000000000", 0], outputs: [[50]]}
    - {types: {}, inputs: ["0x3FC0000000000000", 2], outputs: [[48, 46, 49, 50]]}
    - {types: {}, inputs: ["0x8000000000000000", 2], outputs: [[45, 48, 46, 48, 48]]}
