id: INTRINSICS.FixedEcma
title: Fixed notation as toFixed writes it
version: 1
status: draft
owner: Hawkynt
issue: "#1315"
tests: [Polypiler.Tests/String/IrNumberTextTests.cs]
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: FixedEcma
  group: String
  typeParameters: []
  parameters: [{name: value, type: TYPES.f64}, {name: digits, type: TYPES.i32}]
  returns: [{name: text, type: TYPES.str}]
  legality:
    - {id: digits-constant, text: "digits is a constant from 0 to 100", fact: none}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "the exact value rounded to digits after the point, a tie to the larger magnitude; a minus sign only below zero; from 10^21 on and for a NaN, FormatEcma"
    source: "ECMA-262 2022 §21.1.3.3 (Number.prototype.toFixed)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {}, inputs: ["0x4004000000000000", 0], outputs: [[51]]}
    - {types: {}, inputs: ["0x3FC0000000000000", 2], outputs: [[48, 46, 49, 51]]}
    - {types: {}, inputs: ["0x8000000000000000", 2], outputs: [[48, 46, 48, 48]]}
