id: INTRINSICS.FormatVisualBasic
title: A number as Visual Basic's CStr writes it
version: 1
status: draft
owner: Hawkynt
issue: "#1565"
tests: [Polypiler.Tests/String/IrNumberTextTests.cs]
introducedIn: P5
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: FormatVisualBasic
  group: String
  typeParameters: [{name: N, constraint: float}]
  parameters: [{name: value, type: N}, {name: separator, type: TYPES.i32}]
  returns: [{name: text, type: TYPES.str}]
  legality:
    - {id: separator-constant, text: "separator is a constant code unit other than 0", fact: none}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "15 (f64) or 7 (f32) significant digits of the exact value, a tie to the even digit, no trailing zeros; d.dddE+nn or d.dddE-nn (two exponent digits at least) where the exponent of the first digit is below -4 or not below the digits, fixed notation otherwise; 0 for both zeros, 1.#INF, -1.#INF, -1.#IND; the separator in place of the point"
    source: "[MS-VBAL] 5.5.1.2.4 Let-coercion to and from String; the layout of oleaut32's VarBstrFromR8 and VarBstrFromR4 (%.15G, %.7G) as Wine implements them"
  mustSurviveUntil: IR.stage.legalized-target
  requiresRuntime: true
  vectors:
    - {types: {N: TYPES.f64}, inputs: ["0x4415AF1D78B58C40", 46], outputs: [[49, 69, 43, 50, 48]]}
    - {types: {N: TYPES.f64}, inputs: ["0x3FD5555555555555", 46], outputs: [[48, 46, 51, 51, 51, 51, 51, 51, 51, 51, 51, 51, 51, 51, 51, 51, 51]]}
    - {types: {N: TYPES.f64}, inputs: ["0x3FF8000000000000", 44], outputs: [[49, 44, 53]]}
    - {types: {N: TYPES.f32}, inputs: ["0x3EAAAAAB", 46], outputs: [[48, 46, 51, 51, 51, 51, 51, 51, 51]]}
