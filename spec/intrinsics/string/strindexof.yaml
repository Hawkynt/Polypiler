id: INTRINSICS.StrIndexOf
title: First position of a needle
version: 1
status: draft
owner: Hawkynt
issue: "#1314"
tests: [Polypiler.Tests/String/IrStringTests.cs]
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: StrIndexOf
  group: String
  typeParameters: [{name: N, constraint: any}]
  parameters: [{name: text, type: TYPES.str}, {name: needle, type: N}, {name: from, type: TYPES.i32}]
  returns: [{name: position, type: TYPES.i32}]
  legality:
    - {id: from-in-string, text: "from is within [0, length]; otherwise it traps IndexOutOfRange", fact: range}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "the first start at or after from at which needle, a string or a code unit, stands in text, or -1; an empty needle stands at from; without from, from 0"
    source: "ECMA-262 2022 §22.1.3.9 (indexOf); the .NET API reference of System.String.IndexOf(String, Int32, StringComparison.Ordinal)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {N: TYPES.str}, inputs: [[97, 98, 99, 97, 98, 99], [98, 99], 2], outputs: [4]}
    - {types: {N: TYPES.str}, inputs: [[97, 98, 99], [], 3], outputs: [3]}
    - {types: {N: TYPES.u16}, inputs: [[97, 98, 99], 120, 0], outputs: [-1]}
