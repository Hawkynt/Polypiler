    - {types: {T: TYPES.u16}, inputs: ["0xFF00"], outputs: ["0x00FF"]}
    - {types: {T: TYPES.u8}, inputs: ["0xAB"], outputs: ["0xAB"]}
    - {types: {T: TYPES.i64}, inputs: [1], outputs: [72057594037927936]}
  algebra: [involution]
