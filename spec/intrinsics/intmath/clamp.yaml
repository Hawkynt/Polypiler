id: INTRINSICS.Clamp
title: Clamp to bounds
version: 1
status: draft
owner: Hawkynt
issue: INT-MINMAX
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: Clamp
  group: IntMath
  typeParameters: [{name: T, constraint: any}]
  parameters: [{name: value, type: T}, {name: low, type: T}, {name: high, type: T}]
  returns: [{name: result, type: T}]
  legality:
    - {id: ordered-bounds, text: "low is not above high; otherwise the operation traps with an invalid operation", fact: range}
    - {id: number, text: "T is an integer type or TYPES.f32 or TYPES.f64", fact: none}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "low when value < low, high when value > high, else value; of floats a NaN value is returned and a NaN bound ignored"
    source: ".NET API reference, System.Math.Clamp"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {T: TYPES.i32}, inputs: [-5, 0, 10], outputs: [0]}
    - {types: {T: TYPES.i32}, inputs: [15, 0, 10], outputs: [10]}
    - {types: {T: TYPES.u8}, inputs: ["0x07", "0x00", "0x0A"], outputs: ["0x07"]}
    - {types: {T: TYPES.f64}, inputs: ["0x7FF8000000000000", "0x0000000000000000", "0x3FF0000000000000"], outputs: ["0x7FF8000000000000"]}
    - {types: {T: TYPES.f64}, inputs: ["0x4000000000000000", "0x7FF8000000000000", "0x3FF0000000000000"], outputs: ["0x3FF0000000000000"]}
