id: INTRINSICS.HighWord
title: High limb of a 64-bit integer
version: 1
status: draft
owner: Hawkynt
issue: "#1358"
tests: []
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: HighWord
  group: IntMath
  typeParameters: []
  parameters: [{name: value, type: TYPES.i64}]
  returns: [{name: high, type: TYPES.u32}]
  legality: []
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "the upper 32 bits of the two's complement of value, as an unsigned number; the lower 32 bits are the conversion to u32"
    source: "docs/optimizations/O0075-wide-integer-legalization.md"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {}, inputs: [0], outputs: [0]}
    - {types: {}, inputs: [-1], outputs: ["0xFFFFFFFF"]}
    - {types: {}, inputs: [4294967296], outputs: [1]}
    - {types: {}, inputs: [-9223372036854775808], outputs: ["0x80000000"]}
