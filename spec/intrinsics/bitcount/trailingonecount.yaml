id: INTRINSICS.TrailingOneCount
title: Trailing one count
version: 1
status: draft
owner: Hawkynt
issue: "#95"
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: TrailingOneCount
  group: BitCount
  typeParameters: [{name: T, constraint: integer}]
  parameters: [{name: value, type: T}]
  returns: [{name: count, type: TYPES.i32}]
  legality: []
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "the number of 1 bits below the lowest 0 bit of the bit pattern of value, which is TrailingZeroCount of its complement; the width of T when every bit is 1"
    source: "H. S. Warren, Hacker's Delight, 2nd ed., section 5-4"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {T: TYPES.u32}, inputs: ["0x00000000"], outputs: [0]}
    - {types: {T: TYPES.u32}, inputs: ["0xFFFFFFFF"], outputs: [32]}
    - {types: {T: TYPES.u32}, inputs: ["0x0000000F"], outputs: [4]}
    - {types: {T: TYPES.u8}, inputs: ["0x0F"], outputs: [4]}
    - {types: {T: TYPES.i16}, inputs: [-1], outputs: [16]}
    - {types: {T: TYPES.u64}, inputs: ["0x00000000000000FF"], outputs: [8]}
    - {types: {T: TYPES.i32}, inputs: ["0x7FFFFFFE"], outputs: [0]}
  facts: {resultRange: [0, 64]}
  lowersTo: [INTRINSICS.TrailingZeroCount]
