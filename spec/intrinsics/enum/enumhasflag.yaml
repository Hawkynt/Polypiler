  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {E: TYPES.i32}, inputs: [7, 5], outputs: [1]}
    - {types: {E: TYPES.i32}, inputs: [6, 5], outputs: [0]}
    - {types: {E: TYPES.i32}, inputs: [0, 0], outputs: [1]}
