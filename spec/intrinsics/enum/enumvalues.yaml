id: INTRINSICS.EnumValues
title: The values of the members of an enum in .NET's order
version: 1
status: draft
owner: Hawkynt
issue: "#1318"
tests: [Polypiler.Tests/Enums/IrEnumTests.cs]
introducedIn: P2
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: EnumValues
  group: Enum
  typeParameters: [{name: E, constraint: integer}]
  parameters: [{name: any, type: E}]
  returns: [{name: values, type: "E[]"}]
  legality: []
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "Enum.GetValues: the values of the members ordered by their values read as unsigned numbers of the underlying type; the argument only names the enum. The vectors are of enum S { B = 2, Neg = -1, A = 0, C = 1 }"
    source: ".NET API reference, System.Enum.GetValues(Type)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {E: TYPES.i32}, inputs: [0], outputs: [[0, 1, 2, -1]]}
    - {types: {E: TYPES.i32}, inputs: [2], outputs: [[0, 1, 2, -1]]}
    - {types: {E: TYPES.i32}, inputs: [-1], outputs: [[0, 1, 2, -1]]}
