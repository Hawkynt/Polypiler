id: INTRINSICS.IsSubnormal
title: Subnormal test
version: 1
status: draft
owner: Hawkynt
issue: INT-FLOATREF
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: IsSubnormal
  group: FloatMath
  typeParameters: [{name: F, constraint: float}]
  parameters: [{name: x, type: F}]
  returns: [{name: result, type: TYPES.bool}]
  legality: []
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "x is not zero and its magnitude is below the smallest normal value of F"
    source: "IEEE Std 754-2019, section 5.7.2 (isSubnormal)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {F: TYPES.f64}, inputs: ["0x3FF0000000000000"], outputs: [0]}
    - {types: {F: TYPES.f64}, inputs: ["0x0000000000000000"], outputs: [0]}
    - {types: {F: TYPES.f64}, inputs: ["0x0000000000000001"], outputs: [1]}
    - {types: {F: TYPES.f64}, inputs: ["0x7FF0000000000000"], outputs: [0]}
    - {types: {F: TYPES.f64}, inputs: ["0xFFF0000000000000"], outputs: [0]}
    - {types: {F: TYPES.f64}, inputs: ["0x7FF8000000000000"], outputs: [0]}
    - {types: {F: TYPES.f64}, inputs: ["0x8000000000000000"], outputs: [0]}
    - {types: {F: TYPES.f64}, inputs: ["0x4004000000000000"], outputs: [0]}
    - {types: {F: TYPES.f32}, inputs: ["0x7FC00000"], outputs: [0]}
