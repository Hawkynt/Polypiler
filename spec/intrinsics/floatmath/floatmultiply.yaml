id: INTRINSICS.FloatMultiply
title: Multiply with a rounding mode
version: 1
status: draft
owner: Hawkynt
issue: IR-FLOAT
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: FloatMultiply
  group: FloatMath
  typeParameters: [{name: F, constraint: float}]
  parameters: [{name: x, type: F}, {name: y, type: F}, {name: mode, type: TYPES.i32}]
  returns: [{name: result, type: F}]
  legality:
    - {id: mode-constant, text: "mode is a constant rounding mode: 0 rne, 1 rtz, 2 rup, 3 rdn, 4 rna", fact: range}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "x times y, never fused with an addition, rounded once to the format of F in the rounding mode; a NaN result is the canonical quiet NaN"
    source: "IEEE Std 754-2019, sections 4.3 (rounding-direction attributes) and 5.4.1 (arithmetic operations)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {F: TYPES.f64}, inputs: ["0x3FB999999999999A", "0x3FB999999999999A", 2], outputs: ["0x3F847AE147AE147C"]}
    - {types: {F: TYPES.f64}, inputs: ["0x3FB999999999999A", "0x3FB999999999999A", 3], outputs: ["0x3F847AE147AE147B"]}
    - {types: {F: TYPES.f32}, inputs: ["0x7F7FFFFF", "0x40000000", 0], outputs: ["0x7F800000"]}
    - {types: {F: TYPES.f32}, inputs: ["0x7F7FFFFF", "0x40000000", 1], outputs: ["0x7F7FFFFF"]}
    - {types: {F: TYPES.f32}, inputs: ["0x7F7FFFFF", "0x40000000", 3], outputs: ["0x7F7FFFFF"]}
