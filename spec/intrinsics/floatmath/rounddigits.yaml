id: INTRINSICS.RoundDigits
title: Round to decimal digits
version: 1
status: draft
owner: Hawkynt
issue: INT-FLOATREF
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: RoundDigits
  group: FloatMath
  typeParameters: [{name: F, constraint: float}]
  parameters: [{name: x, type: F}, {name: digits, type: TYPES.i32}, {name: mode, type: TYPES.i32}]
  returns: [{name: result, type: F}]
  legality:
    - {id: digits-in-range, text: "digits is from 0 to 15 for TYPES.f64 and from 0 to 6 for TYPES.f32; otherwise the operation traps with an invalid operation", fact: range}
    - {id: mode-constant, text: "mode is a constant of System.MidpointRounding: 0 ToEven, 1 AwayFromZero, 2 ToZero, 3 ToNegativeInfinity, 4 ToPositiveInfinity", fact: range}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "x rounded to digits decimal digits after the point as System.Math.Round(x, digits, mode) computes it"
    source: ".NET API reference, System.Math.Round(Double, Int32, MidpointRounding)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {F: TYPES.f64}, inputs: ["0x4004000000000000", 0, 0], outputs: ["0x4000000000000000"]}
    - {types: {F: TYPES.f64}, inputs: ["0x4004000000000000", 0, 1], outputs: ["0x4008000000000000"]}
    - {types: {F: TYPES.f64}, inputs: ["0x3FF4000000000000", 1, 1], outputs: ["0x3FF4CCCCCCCCCCCD"]}
    - {types: {F: TYPES.f64}, inputs: ["0xBFF8000000000000", 0, 2], outputs: ["0xBFF0000000000000"]}
