    - {types: {F: TYPES.f64}, inputs: ["0x3FF0000000000000", "0x4008000000000000", 2], outputs: ["0x3FD5555555555556"]}
    - {types: {F: TYPES.f64}, inputs: ["0xBFF0000000000000", "0x4008000000000000", 3], outputs: ["0xBFD5555555555556"]}
    - {types: {F: TYPES.f64}, inputs: ["0x0000000000000001", "0x4000000000000000", 0], outputs: ["0x0000000000000000"]}
