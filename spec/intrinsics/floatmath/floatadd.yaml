id: INTRINSICS.FloatAdd
title: Add with a rounding mode
version: 1
status: draft
owner: Hawkynt
issue: IR-FLOAT
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: FloatAdd
  group: FloatMath
  typeParameters: [{name: F, constraint: float}]
  parameters: [{name: x, type: F}, {name: y, type: F}, {name: mode, type: TYPES.i32}]
  returns: [{name: result, type: F}]
  legality:
    - {id: mode-constant, text: "mode is a constant rounding mode: 0 rne, 1 rtz, 2 rup, 3 rdn, 4 rna", fact: range}
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "x + y, rounded once to the format of F in the rounding mode; a NaN result is the canonical quiet NaN"
    source: "IEEE Std 754-2019, sections 4.3 (rounding-direction attributes) and 5.4.1 (arithmetic operations)"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {F: TYPES.f64}, inputs: ["0x3FB999999999999A", "0x3FC999999999999A", 0], outputs: ["0x3FD3333333333334"]}
    - {types: {F: TYPES.f64}, inputs: ["0x4340000000000000", "0x3FF0000000000000", 2], outputs: ["0x4340000000000001"]}
    - {types: {F: TYPES.f64}, inputs: ["0x4340000000000000", "0x3FF0000000000000", 4], outputs: ["0x4340000000000001"]}
    - {types: {F: TYPES.f64}, inputs: ["0x4340000000000000", "0x3FF0000000000000", 1], outputs: ["0x4340000000000000"]}
    - {types: {F: TYPES.f64}, inputs: ["0x0000000000000000", "0x8000000000000000", 3], outputs: ["0x8000000000000000"]}
    - {types: {F: TYPES.f32}, inputs: ["0x3DCCCCCD", "0x3E4CCCCD", 0], outputs: ["0x3E99999A"]}
