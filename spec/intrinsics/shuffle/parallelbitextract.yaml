id: INTRINSICS.ParallelBitExtract
title: Parallel bit extract
version: 1
status: draft
owner: Hawkynt
issue: INT-PERMUTE-PEXT
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: ParallelBitExtract
  group: Shuffle
  typeParameters: [{name: T, constraint: integer}]
  parameters: [{name: value, type: T}, {name: mask, type: T}]
  returns: [{name: result, type: T}]
  legality: []
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "with m_0 < m_1 < ... < m_(k-1) the positions of the ones of mask, bit j of the result is bit m_j of value for j < k and 0 above; the signedness of T is ignored. Extract(x, 0) = 0, Extract(x, all ones) = x, Deposit(Extract(x, m), m) = x & m"
    source: "Intel 64 and IA-32 Architectures Software Developer's Manual, vol. 2, PEXT; H. S. Warren, Hacker's Delight, 2nd ed., section 7-4 (compress); vectors from System.Runtime.Intrinsics.X86.Bmi2 on .NET 10"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {T: TYPES.u32}, inputs: ["0x12345678", "0x0000FF00"], outputs: ["0x00000056"]}
    - {types: {T: TYPES.u8}, inputs: ["0xB2", "0xF0"], outputs: ["0x0B"]}
    - {types: {T: TYPES.u32}, inputs: ["0x12345678", "0xF0F0F0F0"], outputs: ["0x00001357"]}
    - {types: {T: TYPES.u64}, inputs: ["0xFEDCBA9876543210", "0x00FF00FF00FF00FF"], outputs: ["0x00000000DC985410"]}
    - {types: {T: TYPES.u32}, inputs: ["0xDEADBEEF", "0x00000000"], outputs: ["0x00000000"]}
    - {types: {T: TYPES.u32}, inputs: ["0xDEADBEEF", "0xFFFFFFFF"], outputs: ["0xDEADBEEF"]}
    - {types: {T: TYPES.u32}, inputs: ["0xFFFFFFFF", "0x80000001"], outputs: ["0x00000003"]}
    - {types: {T: TYPES.u16}, inputs: ["0xFFFF", "0x5555"], outputs: ["0x00FF"]}
    - {types: {T: TYPES.i8}, inputs: [-1, -16], outputs: [15]}
