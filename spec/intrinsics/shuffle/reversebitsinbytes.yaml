id: INTRINSICS.ReverseBitsInBytes
title: Reverse the bits in each byte
version: 1
status: draft
owner: Hawkynt
issue: "#104"
tests: []
introducedIn: P1
compatibility: none
reviewedRevision: 0
normative: ""
spec:
  name: ReverseBitsInBytes
  group: Shuffle
  typeParameters: [{name: T, constraint: integer}]
  parameters: [{name: value, type: T}]
  returns: [{name: result, type: T}]
  legality: []
  effects: [pure]
  exactness: {mode: exact}
  reference:
    algorithm: "bit i of value moves to 8 * (i / 8) + 7 - i % 8: the bits of every byte in the opposite order, the bytes in their place; BitReverse is ByteSwap of it"
    source: "H. S. Warren, Hacker's Delight, 2nd ed., section 7-1"
  mustSurviveUntil: IR.stage.legalized-target
  vectors:
    - {types: {T: TYPES.u16}, inputs: ["0x0180"], outputs: ["0x8001"]}
    - {types: {T: TYPES.u32}, inputs: ["0x12345678"], outputs: ["0x482C6A1E"]}
    - {types: {T: TYPES.u8}, inputs: ["0x01"], outputs: ["0x80"]}
    - {types: {T: TYPES.i8}, inputs: [1], outputs: [-128]}
    - {types: {T: TYPES.u64}, inputs: ["0x0123456789ABCDEF"], outputs: ["0x80C4A2E691D5B3F7"]}
  algebra: [involution]
