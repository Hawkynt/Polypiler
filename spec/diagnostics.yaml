    surfaces: "standard error of polypiler-tooling integrity check and seal; reasons are 'hash differs from the golden lock', 'not in the golden lock', 'missing on disk', 'changed together with '<file>'[, ...] in commit <sha>', 'no entry in tests/fixtures/golden.changes.md', 'the entry in tests/fixtures/golden.changes.md does not name the source '<source>'' and 'not a valid golden lock: <reason>' for tests/fixtures/golden.lock.json itself"
  - code: PLY0028
    severity: error
    exit: EnvironmentError
    title: provenance missing
    message: "vectors '<path>' lack independent provenance: <reason>"
    rule: golden.provenance
    area: infrastructure
    owner: INFRA-INTEGRITY
    surfaces: "standard error of polypiler-tooling integrity check and seal, for a *.vectors.json file or a golden.provenance.json marker; reasons include 'no provenance', an unknown kind, a generatedBy naming Polypiler, 'source is not a toolchain key of tooling/toolchains.lock: '<source>'', 'source is not in the corpus lock: '<source>'', 'no vectors' and every other violation of spec/schemas/vectors.schema.json"
  - code: PLY0029
    severity: error
    exit: LicenseBlocker
    title: licence undetectable
    message: "'<path>': no licence could be determined[: <reason>]"
    rule: licences.detection
    area: infrastructure
    owner: INFRA-LICENSES
    surfaces: "standard error of polypiler-tooling licenses scan, for a file no rule yields a licence for, a header expression that does not parse, an unknown licence text, a shared text no declaration selects a variant of, and a Vendored/<library>/ folder without a licence file; of licenses inventory for a notice file or package reference tooling/licensing/third-party.yaml does not list; of a distribution scan for a manifest input or helper whose licence cannot be determined, or a manifest that lists neither; of a project scan for a provenance entry that lacks 'Origin:' or 'Licence:'"
  - code: PLY0030
    severity: error
    exit: TargetBuildFailure
    title: target build failed
    message: "target build failed: '<toolchain> <arguments>' exited with <code>"
    rule: runner.build
    area: infrastructure
    owner: INFRA-RUNNER
    surfaces: "the diagnostics of a run whose outcome is BuildFailed; the step's standard error, or its standard output when standard error is empty, is the cause"
  - code: PLY0031
    severity: error
    exit: BudgetExceeded
    title: time limit exceeded
    message: "time limit of <milliseconds> ms exceeded"
    rule: runner.time
    area: infrastructure
    owner: INFRA-RUNNER
    surfaces: the diagnostics of a run whose outcome is TimedOut
  - code: PLY0032
    severity: error
    exit: BudgetExceeded
    title: memory limit exceeded
    message: "memory limit of <bytes> bytes exceeded"
    rule: runner.memory
    area: infrastructure
    owner: INFRA-RUNNER
    surfaces: the diagnostics of a run whose outcome is MemoryExceeded
  - code: PLY0033
    severity: error
    exit: BudgetExceeded
    title: output limit exceeded
    message: "output limit of <bytes> bytes exceeded"
    rule: runner.output
    area: infrastructure
    owner: INFRA-RUNNER
    surfaces: the diagnostics of a run whose outcome is OutputExceeded
