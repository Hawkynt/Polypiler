# The diagnostics registry (ADR 0003, docs/adr/0003-diagnostics-and-exit-codes.md): every PLY code
# that exists, once, in ascending order. `polypiler-tooling diagnostics validate` checks the file;
# the registry test compares it with every [Diagnostic] descriptor the assemblies declare.
#
# blocks: the ranges each area allocates from (backlog/README.md); a code belongs to the innermost
#   block that contains it, and its `area` must name that block's area.
# codes:
#   code      PLY and four digits
#   severity  info | warning | error
#   exit      the ExitCode member an error stands for; errors only
#   title     a few words naming the diagnostic
#   message   the message, <placeholders> for what the emitter fills in
#   rule      the ID of the rule or specification the diagnostic enforces; the descriptor carries the same
#   area      the area of the block the code lies in
#   owner     the backlog ID of the issue that registered the code
#   surfaces  where the diagnostic is seen (optional)
#   strict    true when --strict turns the warning into an error (optional, warnings only)
#   reserved  true while the owning issue has not been implemented: nothing may declare the code yet
#   retired   true for a code that is no longer emitted; it is never given to anything else
schema: 1

blocks:
  - { first: PLY0001, last: PLY0099, area: infrastructure }
  - { first: PLY0100, last: PLY0199, area: ir }
