# The diagnostics registry (ADR 0003, docs/adr/0003-diagnostics-and-exit-codes.md): every PLY code
# that exists, once, in ascending order. `polypiler-tooling diagnostics validate` checks the file;
# the registry test compares it with every [Diagnostic] descriptor the assemblies declare.
#
# blocks: the ranges each area allocates from (backlog/README.md); a code belongs to the innermost
#   block that contains it, and its `area` must name that block's area.
# codes:
#   code      PLY and four digits
#   severity  info | warning | error
#   exit      the ExitCode member an error stands for; errors only
#   title     a few words naming the diagnostic
#   message   the message, <placeholders> for what the emitter fills in
#   rule      the ID of the rule or specification the diagnostic enforces; the descriptor carries the same
#   area      the area of the block the code lies in
#   owner     the backlog ID of the issue that registered the code
#   surfaces  where the diagnostic is seen (optional)
#   strict    true when --strict turns the warning into an error (optional, warnings only)
#   reserved  true while the owning issue has not been implemented: nothing may declare the code yet
#   retired   true for a code that is no longer emitted; it is never given to anything else
schema: 1

blocks:
  - { first: PLY0001, last: PLY0099, area: infrastructure }
  - { first: PLY0100, last: PLY0199, area: ir }
  - { first: PLY0200, last: PLY0299, area: types }
  - { first: PLY0300, last: PLY0399, area: optimization }
  - { first: PLY0400, last: PLY0499, area: recognition }
  - { first: PLY0500, last: PLY0599, area: legalization }
  - { first: PLY0600, last: PLY0699, area: interop }
  - { first: PLY0700, last: PLY0799, area: objects }
  # permutation is divided by concern (PERM-MODEL): model and hierarchy 0800-0809, networks and
  # primitives 0810-0819, search and equivalence 0820-0829, recovery 0830-0839, target profiles
  # 0840-0849, API and command line 0850-0859; 0860-0899 are unassigned.
  - { first: PLY0800, last: PLY0899, area: permutation }
  - { first: PLY0900, last: PLY0999, area: catalog }
  - { first: PLY1000, last: PLY2999, area: languages }
  - { first: PLY1000, last: PLY1099, area: csharp }
  - { first: PLY1100, last: PLY1199, area: javascript }
  - { first: PLY1200, last: PLY1299, area: powerbasic }
  - { first: PLY1300, last: PLY1399, area: c }
  - { first: PLY1400, last: PLY1499, area: cpp }
  - { first: PLY1500, last: PLY1599, area: rust }
  - { first: PLY1600, last: PLY1699, area: kotlin }
  - { first: PLY1700, last: PLY1799, area: perl }
  - { first: PLY1800, last: PLY1899, area: python }
  - { first: PLY1900, last: PLY1999, area: typescript }
  - { first: PLY2000, last: PLY2099, area: java }
  - { first: PLY2100, last: PLY2199, area: go }
  - { first: PLY2200, last: PLY2299, area: delphi }
  - { first: PLY2300, last: PLY2399, area: freebasic }
  - { first: PLY2400, last: PLY2499, area: php }
  - { first: PLY2500, last: PLY2599, area: ruby }
  - { first: PLY2600, last: PLY2699, area: visualbasic }
  - { first: PLY2700, last: PLY2799, area: vintagebasic }
  - { first: PLY2800, last: PLY2899, area: batch }
  - { first: PLY3000, last: PLY3999, area: formats }
  - { first: PLY3000, last: PLY3099, area: msil }
  - { first: PLY3100, last: PLY3199, area: jvm }
  - { first: PLY3200, last: PLY3299, area: wasm }
  - { first: PLY3300, last: PLY3399, area: llvm }
  - { first: PLY3400, last: PLY3499, area: mos65xx }
  - { first: PLY3500, last: PLY3599, area: z80-8080-68000 }
  - { first: PLY3600, last: PLY3699, area: x86-16 }
  - { first: PLY3700, last: PLY3799, area: x86 }
  - { first: PLY3800, last: PLY3899, area: arm }
  - { first: PLY3900, last: PLY3999, area: tokenized-basic }
  - { first: PLY4000, last: PLY4099, area: machine }

codes:
  - code: PLY0001
    severity: error
    exit: InternalError
    title: internal compiler error
    message: "internal compiler error: <exception>"
    rule: adr-0003.internal-error
    area: infrastructure
    owner: ADR-DIAGNOSTICS
    surfaces: "any command, for an exception nothing anticipated, and as \"command '<name>' returned <n> without a diagnostic\" for a command that fails without reporting an error; its presence makes the exit code 70 whatever else was reported"
  - code: PLY0002
    severity: error
    exit: UsageError
    title: unknown command
    message: "unknown command '<word>'; run 'polypiler --help'"
    rule: adr-0004.grammar
    area: infrastructure
    owner: CLI-FOUNDATION
    surfaces: "standard error of polypiler, alone, for a command name no command is registered under, also as the word of 'help <word>' or before --help"
  - code: PLY0003
    severity: error
    exit: UsageError
    title: command line not understood
    message: "<reason>"
    rule: adr-0004.grammar
    area: infrastructure
    owner: INFRA-TOOLCHAINS
    surfaces: "standard error of polypiler, alone, for a command line the grammar of ADR 0004 refuses (unknown option, option without its value, flag given a value, option given more than once, value outside its set, empty list element, missing required option, missing or surplus operand, no command), and of polypiler translate for a language it does not know or an option that does not apply to the languages chosen; standard error of polypiler-tooling toolchains, diagnostics and fuzz as '<command>: error PLY0003: <reason>', for fuzz also an unknown target and a corpus directory that is missing or empty; standard error of polypiler-tooling rebuild check for '--runs' below 2 or not a number, a missing '--output' or '-- <toolchain key>', an '--output' that is absolute or contains '..', and an '--input' that does not exist, and of rebuild compare for a directory that does not exist"
  - code: PLY0004
    severity: error
    exit: EnvironmentError
    title: file cannot be read
    message: "cannot read the toolchain lock: <reason>"
    rule: io.read
    area: infrastructure
    owner: INFRA-TOOLCHAINS
    surfaces: "standard error of polypiler-tooling toolchains validate and probe; standard error of polypiler as \"input '<path>' does not exist or is not readable\" for an input of the command line; standard error of polypiler-tooling ci as \"'<path>' cannot be read: <reason>\" for a workflow, category file, test listing, lock, changed-file list or test build it needs and cannot read; standard error of polypiler-tooling report capabilities as \"'<path>' cannot be read: the spec root does not exist\" or \"... the gate directory does not exist\""
  - code: PLY0005
    severity: error
    exit: EnvironmentError
    title: output not writable
    message: "output directory '<path>' is not empty; pass --force to write into it"
    rule: io.write
    area: infrastructure
    owner: CLI-FOUNDATION
    surfaces: "standard error of polypiler for an output directory that is not empty without --force, and as \"output path '<path>' cannot be created: <reason>\" for one that is a file or cannot be created or written; standard error of polypiler-tooling report errors as \"the output directory '<path>' cannot be written: <reason>\" when the output directory cannot be created or a page cannot be written or deleted; standard error of polypiler-tooling fuzz run and fuzz minimize, in that form too, after the PLY0070 of a finding whose record under artifacts/fuzz/<target>/ cannot be written; standard error of polypiler-tooling report capabilities in that form when docs/capabilities.json or docs/capabilities.md cannot be written, leaving no partial file"
  - code: PLY0006
    severity: error
    exit: UsageError
    title: unknown identifier
    message: "unknown <kind> '<identifier>'"
    area: infrastructure
    owner: CLI-TRANSLATE
    reserved: true
  - code: PLY0007
    severity: error
    exit: UsageError
    title: assumption not understood
    message: "'<assumption>' is not an assumption: <reason>"
    area: infrastructure
    owner: CLI-OPTIONS
    reserved: true
  - code: PLY0008
    severity: error
    exit: UsageError
    title: unknown optimization ID
    message: "'<id>' is not an optimization ID (expected O followed by four digits)"
    area: infrastructure
    owner: CLI-OPTIONS
    reserved: true
  - code: PLY0009
    severity: warning
    title: assumption trusted
    message: "assumption '<assumption>' is trusted, not proven"
    area: infrastructure
    owner: CLI-OPTIONS
    strict: true
    reserved: true
  - code: PLY0010
    severity: error
    exit: UnsupportedConstruct
    title: refused under --strict
    message: "<code>: <message> (refused by --strict)"
    area: infrastructure
    owner: CLI-OPTIONS
    reserved: true
  - code: PLY0011
    severity: error
    exit: UsageError
    title: exclusive options
    message: "options '<first>' and '<second>' cannot be combined"
    rule: adr-0004.grammar
    area: infrastructure
    owner: CLI-FOUNDATION
    surfaces: "standard error of polypiler, alone, for two options a command declares exclusive"
  - code: PLY0012
    severity: error
    exit: UsageError
    title: unknown optimization level
    message: "'<level>' is not an optimization level; expected one of: <levels>"
    area: infrastructure
    owner: CLI-OPTIONS
    reserved: true
  - code: PLY0013
    severity: error
    exit: InvalidSource
    title: export not found
    message: "export '<name>' not found in '<file>'"
    area: infrastructure
    owner: CLI-TRANSLATE
    reserved: true
  - code: PLY0014
    severity: error
    exit: UnsupportedConstruct
