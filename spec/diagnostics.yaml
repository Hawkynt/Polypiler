    exit: EnvironmentError
    title: no manifest
    message: "no manifest in '<path>'"
    rule: cli.verify.manifest
    area: infrastructure
    owner: CLI-VERIFY
    surfaces: standard error of polypiler verify for a directory without polypiler.manifest.json
  - code: PLY0017
    severity: error
    exit: UsageError
    title: vectors not understood
    message: "'<path>' holds no test vectors: <reason>"
    rule: cli.verify.vectors
    area: infrastructure
    owner: CLI-VERIFY
    surfaces: standard error of polypiler verify for a vector file that is not JSON or not of the vector file format, or whose call signature the JavaScript driver cannot pass
  - code: PLY0018
    severity: error
    exit: EnvironmentError
    title: catalogue index unreadable
    message: "catalogue index '<path>' not found"
    area: infrastructure
    owner: CLI-SEARCH
    reserved: true
  - code: PLY0019
    severity: error
    exit: UsageError
    title: unknown algorithm
    message: "unknown algorithm '<id>'"
    area: infrastructure
    owner: CLI-GENERATE
    reserved: true
  - code: PLY0020
    severity: error
    exit: EnvironmentError
    title: toolchain lock invalid
    message: "<reason>"
    rule: toolchains.lock
    area: infrastructure
    owner: INFRA-TOOLCHAINS
    surfaces: "standard error of polypiler-tooling toolchains validate and probe as '<file>(<line>,<column>): error PLY0020: <reason>'; reasons include a missing or unknown property, an unsupported schema, keys out of ordinal order, a versionPattern without the group 'version', a missing core toolchain and an unknown key"
  - code: PLY0021
