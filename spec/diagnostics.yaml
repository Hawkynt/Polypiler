codes:
  - code: PLY0001
    severity: error
    exit: InternalError
    title: internal compiler error
    message: "internal compiler error: <exception>"
    rule: adr-0003.internal-error
    area: infrastructure
    owner: ADR-DIAGNOSTICS
    surfaces: "any command, for an exception nothing anticipated, and as \"command '<name>' returned <n> without a diagnostic\" for a command that fails without reporting an error; its presence makes the exit code 70 whatever else was reported"
  - code: PLY0002
    severity: error
    exit: UsageError
    title: unknown command
    message: "unknown command '<word>'; run 'polypiler --help'"
    rule: adr-0004.grammar
    area: infrastructure
    owner: CLI-FOUNDATION
    surfaces: "standard error of polypiler, alone, for a command name no command is registered under, also as the word of 'help <word>' or before --help"
  - code: PLY0003
    severity: error
    exit: UsageError
    title: command line not understood
    message: "<reason>"
    rule: adr-0004.grammar
    area: infrastructure
    owner: INFRA-TOOLCHAINS
    surfaces: "standard error of polypiler, alone, for a command line the grammar of ADR 0004 refuses (unknown option, option without its value, flag given a value, option given more than once, value outside its set, empty list element, missing required option, missing or surplus operand, no command), and of polypiler translate for a language it does not know or an option that does not apply to the languages chosen; standard error of polypiler-tooling toolchains, diagnostics and fuzz as '<command>: error PLY0003: <reason>', for fuzz also an unknown target and a corpus directory that is missing or empty"
  - code: PLY0004
    severity: error
    exit: EnvironmentError
    title: file cannot be read
    message: "cannot read the toolchain lock: <reason>"
    rule: io.read
    area: infrastructure
    owner: INFRA-TOOLCHAINS
    surfaces: "standard error of polypiler-tooling toolchains validate and probe; standard error of polypiler as \"input '<path>' does not exist or is not readable\" for an input of the command line"
  - code: PLY0005
    severity: error
    exit: EnvironmentError
    title: output not writable
    message: "output directory '<path>' is not empty; pass --force to write into it"
    rule: io.write
    area: infrastructure
    owner: CLI-FOUNDATION
    surfaces: "standard error of polypiler for an output directory that is not empty without --force, and as \"output path '<path>' cannot be created: <reason>\" for one that is a file or cannot be created or written; standard error of polypiler-tooling report errors as \"the output directory '<path>' cannot be written: <reason>\" when the output directory cannot be created or a page cannot be written or deleted; standard error of polypiler-tooling fuzz run and fuzz minimize, in that form too, after the PLY0070 of a finding whose record under artifacts/fuzz/<target>/ cannot be written"
  - code: PLY0006
    severity: error
    exit: UsageError
