  - code: PLY0023
    severity: error
    exit: EnvironmentError
    title: corpus hash mismatch
    message: "corpus file '<repository>:<path>' has SHA-256 <actual>, the lock records <expected>[ (<n> bytes, the lock records <m> bytes)]"
    rule: corpus.lock
    area: infrastructure
    owner: INFRA-CORPUS
    surfaces: "standard error of polypiler-tooling corpus import (before anything is written) and corpus verify; also 'corpus file '<repository>:<path>' cannot be read, the lock records <expected>: <reason>' for a locked file that is missing; the failure of a test that opens a stale fixture with CorpusFixture.Open; standard error of polypiler-tooling licenses scan --mode corpus for a locked file that is not imported"
  - code: PLY0024
    severity: error
    exit: LicenseBlocker
    title: licence not approved
    message: "'<path>': licence '<expression>' is denied in <mode> mode[ (<licence> awaits an owner decision, requested by <issue>)]"
    rule: licences.policy
    area: infrastructure
    owner: INFRA-LICENSES
    surfaces: "standard error of polypiler-tooling licenses scan and licenses inventory; also ''<path>': declared licence '<declared>' disagrees with detected '<family>'' and ''<path>' is a restricted asset and may not be redistributed'; for a generated package ''<dir>': output licence '<stated>' understates the effective licence '<effective>' (because of <origin>)'' and ''<origin>': licence '<expression>' is reference-only|denied and cannot be part of an output''; in project mode ''<path>': GPL-derived code may not be merged into the LGPL-licensed compiler projects; keep '<origin>' as a rung 2 reference''"
  - code: PLY0025
    severity: error
    exit: EnvironmentError
    title: corpus path invalid
    message: "'<path>' does not exist in <repository> at <commit>[: <cause>]"
    rule: corpus.path
    area: infrastructure
    owner: INFRA-CORPUS
    surfaces: "standard error of polypiler-tooling corpus import and discover, git's stderr as the cause; also '<repository> at <commit> cannot be fetched from <url>: <cause>', 'the files of <repository> at <commit> cannot be listed: <cause>' and 'corpus path '<path>' cannot be written: <cause>' and, from polypiler-tooling licenses scan, 'licence report '<file>' cannot be written: <cause>'"
  - code: PLY0026
    severity: error
    exit: EnvironmentError
    title: corpus manifest invalid
    message: "corpus manifest invalid: <reason>"
    rule: corpus.manifest
    area: infrastructure
    owner: INFRA-CORPUS
    surfaces: "standard error of polypiler-tooling corpus import, verify and discover; reasons include a schema violation of corpus.yaml or corpus.lock.json, a fixture naming an undeclared repository, a duplicated fixture ID, an absolute path or one containing '..', a file under corpus/upstream that is not in the lock, a file not yet in the lock and an unknown fixture or repository asked for; also standard error of polypiler-tooling licenses scan and licenses inventory with the reasons 'licence policy: <detail>' (tooling/licensing/policy.yaml or its DECISIONS.md), 'licence declarations: <detail>' (licences.yaml of a scanned tree) and 'licence inventory: <detail>' (tooling/licensing/third-party.yaml); also standard error of polypiler-tooling rebuild check and rebuild compare with the reason 'rebuild ignore: <detail>' for a tooling/ci/rebuild-ignore.yaml that is not schema 1, has an unknown key, an entry without its reason or a manifest pointer that is not an RFC 6901 pointer below the root"
  - code: PLY0027
