# The diagnostics registry (ADR 0003, docs/adr/0003-diagnostics-and-exit-codes.md): every PLY code
# that exists, once, in ascending order. `polypiler-tooling diagnostics validate` checks the file;
# the registry test compares it with every [Diagnostic] descriptor the assemblies declare.
#
# blocks: the ranges each area allocates from (backlog/README.md); a code belongs to the innermost
#   block that contains it, and its `area` must name that block's area.
# codes:
#   code      PLY and four digits
#   severity  info | warning | error
#   exit      the ExitCode member an error stands for; errors only
#   title     a few words naming the diagnostic
#   message   the message, <placeholders> for what the emitter fills in
#   rule      the ID of the rule or specification the diagnostic enforces; the descriptor carries the same
#   area      the area of the block the code lies in
#   owner     the backlog ID of the issue that registered the code
#   surfaces  where the diagnostic is seen (optional)
#   strict    true when --strict turns the warning into an error (optional, warnings only)
#   reserved  true while the owning issue has not been implemented: nothing may declare the code yet
#   retired   true for a code that is no longer emitted; it is never given to anything else
schema: 1

blocks:
  - { first: PLY0001, last: PLY0099, area: infrastructure }
  - { first: PLY0100, last: PLY0199, area: ir }
  - { first: PLY0200, last: PLY0299, area: types }
  - { first: PLY0300, last: PLY0399, area: optimization }
  - { first: PLY0400, last: PLY0499, area: recognition }
  - { first: PLY0500, last: PLY0599, area: legalization }
  - { first: PLY0600, last: PLY0699, area: interop }
  - { first: PLY0700, last: PLY0799, area: objects }
  # permutation is divided by concern (PERM-MODEL): model and hierarchy 0800-0809, networks and
  # primitives 0810-0819, search and equivalence 0820-0829, recovery 0830-0839, target profiles
  # 0840-0849, API and command line 0850-0859; 0860-0899 are unassigned.
  - { first: PLY0800, last: PLY0899, area: permutation }
  - { first: PLY0900, last: PLY0999, area: catalog }
  - { first: PLY1000, last: PLY2999, area: languages }
  - { first: PLY1000, last: PLY1099, area: csharp }
  - { first: PLY1100, last: PLY1199, area: javascript }
  - { first: PLY1200, last: PLY1299, area: powerbasic }
  - { first: PLY1300, last: PLY1399, area: c }
  - { first: PLY1400, last: PLY1499, area: cpp }
  - { first: PLY1500, last: PLY1599, area: rust }
  - { first: PLY1600, last: PLY1699, area: kotlin }
  - { first: PLY1700, last: PLY1799, area: perl }
  - { first: PLY1800, last: PLY1899, area: python }
  - { first: PLY1900, last: PLY1999, area: typescript }
  - { first: PLY2000, last: PLY2099, area: java }
  - { first: PLY2100, last: PLY2199, area: go }
  - { first: PLY2200, last: PLY2299, area: delphi }
  - { first: PLY2300, last: PLY2399, area: freebasic }
  - { first: PLY2400, last: PLY2499, area: php }
  - { first: PLY2500, last: PLY2599, area: ruby }
  - { first: PLY2600, last: PLY2699, area: visualbasic }
  - { first: PLY2700, last: PLY2799, area: vintagebasic }
  - { first: PLY3000, last: PLY3999, area: formats }
  - { first: PLY3000, last: PLY3099, area: msil }
  - { first: PLY3100, last: PLY3199, area: jvm }
  - { first: PLY3200, last: PLY3299, area: wasm }
  - { first: PLY3300, last: PLY3399, area: llvm }
  - { first: PLY3400, last: PLY3499, area: mos65xx }
  - { first: PLY3500, last: PLY3599, area: z80-8080-68000 }
  - { first: PLY3600, last: PLY3699, area: x86-16 }
  - { first: PLY3700, last: PLY3799, area: x86 }
